<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Search Analytics — DCC Admin</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0F1B2D;color:#F0F4F8;min-height:100vh;}
    #lock-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:1rem;}
    #lock-screen h1{font-size:1.4rem;color:#00C9A7;}
    #pin-input{padding:0.75rem 1rem;font-size:1.2rem;border-radius:8px;border:2px solid #243d59;background:#1A2D44;color:#F0F4F8;text-align:center;letter-spacing:0.2em;width:160px;}
    #pin-input:focus{outline:none;border-color:#00C9A7;}
    #pin-error{color:#E74C3C;font-size:0.85rem;min-height:1.2em;}
    #dashboard{display:none;padding:2rem;max-width:900px;margin:0 auto;}
    h1{color:#00C9A7;font-size:1.5rem;margin-bottom:0.25rem;}
    .subtitle{color:#8AA0B8;font-size:0.85rem;margin-bottom:2rem;}
    .stats-row{display:flex;gap:1rem;flex-wrap:wrap;margin-bottom:2rem;}
    .stat-card{background:#1A2D44;border:1px solid #243d59;border-radius:10px;padding:1rem 1.5rem;flex:1;min-width:140px;}
    .stat-card .num{font-size:2rem;font-weight:700;color:#00C9A7;}
    .stat-card .label{font-size:0.75rem;color:#8AA0B8;text-transform:uppercase;letter-spacing:0.06em;}
    table{width:100%;border-collapse:collapse;font-size:0.88rem;margin-bottom:2rem;}
    th{background:#131f2e;color:#8AA0B8;text-align:left;padding:0.6rem 0.75rem;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.06em;}
    td{padding:0.6rem 0.75rem;border-bottom:1px solid #243d59;}
    tr:hover td{background:#1A2D44;}
    .zero-badge{background:#E74C3C22;color:#E74C3C;border-radius:6px;padding:2px 7px;font-size:0.8em;}
    .count-badge{background:#00C9A722;color:#00C9A7;border-radius:6px;padding:2px 7px;font-size:0.8em;}
    section h2{font-size:1rem;color:#F0F4F8;margin-bottom:0.75rem;}
    .btn{padding:0.5rem 1.25rem;border-radius:8px;border:none;cursor:pointer;font-size:0.85rem;font-weight:600;}
    .btn-danger{background:#E74C3C22;color:#E74C3C;border:1px solid #E74C3C44;}
    .btn-danger:hover{background:#E74C3C;color:#fff;}
    .btn-secondary{background:#243d59;color:#F0F4F8;}
    .btn-secondary:hover{background:#2d4e73;}
    .actions{display:flex;gap:0.75rem;margin-bottom:2rem;}
    .no-data{color:#5A6E84;font-style:italic;font-size:0.9rem;padding:1rem 0;}
  </style>
</head>
<body>

<div id="lock-screen">
  <h1>DCC Search Analytics</h1>
  <p style="color:#8AA0B8;font-size:0.9rem;">Enter PIN to access</p>
  <input type="password" id="pin-input" placeholder="••••" maxlength="6" inputmode="numeric" autocomplete="off">
  <p id="pin-error"></p>
</div>

<div id="dashboard">
  <h1>Search Analytics</h1>
  <p class="subtitle">Data stored locally in this browser. Last updated: <span id="last-updated">—</span></p>

  <div class="stats-row" id="stats-row">
    <!-- populated by JS -->
  </div>

  <div class="actions">
    <button class="btn btn-secondary" onclick="exportCSV()">Export CSV</button>
    <button class="btn btn-danger" onclick="clearData()">Clear All Data</button>
  </div>

  <section>
    <h2>Top Searches (by frequency)</h2>
    <table id="tbl-top">
      <thead><tr><th>Query</th><th>Searches</th><th>Zero Results</th></tr></thead>
      <tbody id="tbody-top"></tbody>
    </table>
  </section>

  <section>
    <h2>Zero-Result Searches (what people can't find)</h2>
    <table id="tbl-zero">
      <thead><tr><th>Query</th><th>Count</th></tr></thead>
      <tbody id="tbody-zero"></tbody>
    </table>
  </section>

  <section>
    <h2>Recent Searches (last 50)</h2>
    <table id="tbl-recent">
      <thead><tr><th>Query</th><th>Results</th><th>Date / Time</th></tr></thead>
      <tbody id="tbody-recent"></tbody>
    </table>
  </section>
</div>

<script>
  var PIN = '2026';
  var ANALYTICS_KEY = 'dc-search-analytics';

  document.getElementById('pin-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') checkPin();
  });
  document.getElementById('pin-input').addEventListener('input', function(){
    if (this.value.length === PIN.length) checkPin();
  });

  function checkPin() {
    var val = document.getElementById('pin-input').value;
    if (val === PIN) {
      document.getElementById('lock-screen').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      loadData();
    } else {
      document.getElementById('pin-error').textContent = 'Incorrect PIN';
      document.getElementById('pin-input').value = '';
    }
  }

  function loadData() {
    var raw = [];
    try { raw = JSON.parse(localStorage.getItem(ANALYTICS_KEY) || '[]'); } catch(e){}

    if (!raw.length) {
      document.getElementById('stats-row').innerHTML = '<p class="no-data">No search data recorded yet. Data is captured when users search on the site.</p>';
      return;
    }

    // Last updated
    var latest = raw[raw.length - 1];
    document.getElementById('last-updated').textContent = new Date(latest.t).toLocaleString('en-CA');

    // Stats
    var totalSearches = raw.length;
    var zeroResults = raw.filter(function(r){ return r.n === 0; }).length;
    var uniqueQueries = Object.keys(raw.reduce(function(acc, r){
      acc[r.q.toLowerCase()] = 1; return acc;
    }, {})).length;
    var zeroRate = totalSearches ? Math.round(zeroResults / totalSearches * 100) : 0;

    document.getElementById('stats-row').innerHTML = [
      stat(totalSearches, 'Total Searches'),
      stat(uniqueQueries, 'Unique Queries'),
      stat(zeroResults, 'Zero-Result Searches'),
      stat(zeroRate + '%', 'Zero-Result Rate'),
    ].join('');

    // Top queries
    var counts = {};
    var zeroCounts = {};
    raw.forEach(function(r){
      var q = r.q.toLowerCase();
      counts[q] = (counts[q] || 0) + 1;
      if (r.n === 0) zeroCounts[q] = (zeroCounts[q] || 0) + 1;
    });
    var topList = Object.keys(counts).sort(function(a,b){ return counts[b]-counts[a]; }).slice(0, 30);

    var tbodyTop = document.getElementById('tbody-top');
    if (topList.length) {
      tbodyTop.innerHTML = topList.map(function(q){
        return '<tr><td>' + esc(q) + '</td>' +
          '<td><span class="count-badge">' + counts[q] + '</span></td>' +
          '<td>' + (zeroCounts[q] ? '<span class="zero-badge">' + zeroCounts[q] + '</span>' : '—') + '</td></tr>';
      }).join('');
    } else {
      tbodyTop.innerHTML = '<tr><td colspan="3" class="no-data">No data</td></tr>';
    }

    // Zero-result queries
    var zeroList = Object.keys(zeroCounts).sort(function(a,b){ return zeroCounts[b]-zeroCounts[a]; }).slice(0, 20);
    var tbodyZero = document.getElementById('tbody-zero');
    if (zeroList.length) {
      tbodyZero.innerHTML = zeroList.map(function(q){
        return '<tr><td>' + esc(q) + '</td><td><span class="zero-badge">' + zeroCounts[q] + '</span></td></tr>';
      }).join('');
    } else {
      tbodyZero.innerHTML = '<tr><td colspan="2" style="color:#5A6E84;font-style:italic;">No zero-result searches recorded.</td></tr>';
    }

    // Recent 50
    var recent = raw.slice(-50).reverse();
    document.getElementById('tbody-recent').innerHTML = recent.map(function(r){
      return '<tr><td>' + esc(r.q) + '</td>' +
        '<td>' + (r.n === 0 ? '<span class="zero-badge">0</span>' : '<span class="count-badge">' + r.n + '</span>') + '</td>' +
        '<td style="color:#8AA0B8;font-size:0.8em">' + new Date(r.t).toLocaleString('en-CA') + '</td></tr>';
    }).join('');
  }

  function stat(num, label) {
    return '<div class="stat-card"><div class="num">' + num + '</div><div class="label">' + label + '</div></div>';
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function exportCSV() {
    var raw = [];
    try { raw = JSON.parse(localStorage.getItem(ANALYTICS_KEY) || '[]'); } catch(e){}
    if (!raw.length) { alert('No data to export.'); return; }
    var csv = 'Query,Results,Timestamp\n' + raw.map(function(r){
      return '"' + r.q.replace(/"/g,'""') + '",' + r.n + ',' + new Date(r.t).toISOString();
    }).join('\n');
    var blob = new Blob([csv], { type: 'text/csv' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = 'dcc-search-analytics.csv'; a.click();
    URL.revokeObjectURL(url);
  }

  function clearData() {
    if (!confirm('Delete all search analytics data? This cannot be undone.')) return;
    localStorage.removeItem(ANALYTICS_KEY);
    location.reload();
  }
</script>
</body>
</html>
