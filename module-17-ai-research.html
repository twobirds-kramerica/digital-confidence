      <h1 data-en="Module 17: Using AI for Research" data-fr="Module 17 : Utiliser l'IA pour faire des recherches">Module 17: Using AI for Research</h1>
      <p class="what-you-learn"><strong data-en="What you will learn:" data-fr="Ce que vous apprendrez :">What you will learn:</strong> <span data-en="How to use AI tools like Siri, ChatGPT, and Google Gemini to find information, ask better questions, check whether answers are accurate, protect your privacy, and know when to call a professional instead." data-fr="Comment utiliser des outils d'IA comme Siri, ChatGPT et Google Gemini pour trouver des informations, poser de meilleures questions, vérifier l'exactitude des réponses, protéger votre vie privée et savoir quand appeler un professionnel à la place.">How to use AI tools like Siri, ChatGPT, and Google Gemini to find information, ask better questions, check whether answers are accurate, protect your privacy, and know when to call a professional instead.</span></p>

      <img class="module-hero-image" src="images/module-17-hero.jpg" alt="A person using a tablet to interact with an AI assistant, representing the use of artificial intelligence for research and learning" width="1200" height="400" loading="eager">

      </div>

      <div class="dcc-quiz-container" id="dcc-before-quiz" aria-label="Knowledge check — before you start"></div>

      <div class="module-intro">
        <p class="module-time" data-en="⏱ About 25–35 minutes — go at your own pace" data-fr="⏱ Environ 25–35 minutes — allez à votre rythme">⏱ About 25–35 minutes — go at your own pace</p>

      <!-- ═══ DOROTHY'S STORY ═══ -->
      <div class="story-box">
        <h3 data-en="Dorothy's Story" data-fr="L'histoire de Dorothy">Dorothy's Story</h3>
        <p data-en="Dorothy, 74, from Woodstock, Ontario, wanted to know more about her new blood pressure medication before her next doctor's appointment. She used to spend hours on confusing health websites, often finishing more worried than when she started. A friend showed her how to ask Siri: 'What does lisinopril do, in simple terms?' The answer came back clear and plain. She wrote down two follow-up questions for her doctor. 'I felt like I actually had something useful to bring to my appointment for once,' she said." data-fr="Dorothy, 74 ans, de Woodstock en Ontario, voulait en savoir plus sur son nouveau médicament pour la tension artérielle avant son prochain rendez-vous médical. Elle passait des heures sur des sites de santé compliqués, terminant souvent plus inquiète qu'au début. Une amie lui a montré comment demander à Siri : 'Que fait le lisinopril, en termes simples ?' La réponse est arrivée claire et accessible. Elle a noté deux questions de suivi pour son médecin. 'Pour une fois, j'avais quelque chose d'utile à apporter à mon rendez-vous,' a-t-elle dit.">Dorothy, 74, from Woodstock, Ontario, wanted to know more about her new blood pressure medication before her next doctor's appointment. She used to spend hours on confusing health websites, often finishing more worried than when she started. A friend showed her how to ask Siri: "What does lisinopril do, in simple terms?" The answer came back clear and plain. She wrote down two follow-up questions for her doctor. "I felt like I actually had something useful to bring to my appointment for once," she said.</p>
      </div>

      <!-- ═══ SECTION 1: WHAT IS AI? ═══ -->
      <div class="coach-tip">
        <div class="coach-tip__header">
          <span class="coach-tip__icon" aria-hidden="true">❤️</span>
          <span class="coach-tip__label">From your coach</span>
        </div>
        <p>Asking an AI assistant a question for the first time can feel strange — like talking to someone who might be making things up. That instinct is exactly right, and it is the most important skill in this lesson. Curious people who double-check answers get the best of AI without being fooled by it. You are already thinking like a researcher.</p>
      </div>

      <h2 data-en="1. What Is AI Research?" data-fr="1. Qu'est-ce que la recherche par IA ?">1. What Is AI Research?</h2>

      <p data-en="Artificial intelligence (AI) tools are programmes that can answer questions, explain things, and have a back-and-forth conversation with you — like texting a very knowledgeable friend who never gets impatient. They are not magic, they are not alive, and they do not always get things right. But used wisely, they can be genuinely helpful." data-fr="Les outils d'intelligence artificielle (IA) sont des programmes qui peuvent répondre à des questions, expliquer des choses et avoir une conversation avec vous, comme envoyer des messages à un ami très savant qui ne perd jamais patience. Ils ne sont pas magiques, ils ne sont pas vivants et ils ne se trompent pas toujours. Mais utilisés judicieusement, ils peuvent être vraiment utiles.">Artificial intelligence (AI) tools are programmes that can answer questions, explain things, and have a back-and-forth conversation with you — like texting a very knowledgeable friend who never gets impatient. They are not magic, they are not alive, and they do not always get things right. But used wisely, they can be genuinely helpful.</p>

      <h3 data-en="The Main AI Tools You May Encounter" data-fr="Les principaux outils d'IA que vous pourriez rencontrer">The Main AI Tools You May Encounter</h3>
      <ul class="content-list">
        <li data-en="Siri — built into every iPhone and iPad. Tap the small circle at the bottom of the screen or say 'Hey Siri.' Best for quick questions, setting reminders, making calls, and playing music." data-fr="Siri — intégré à chaque iPhone et iPad. Appuyez sur le petit cercle en bas de l'écran ou dites 'Dis Siri.' Idéal pour les questions rapides, les rappels, les appels téléphoniques et la musique.">Siri — built into every iPhone and iPad. Tap the small circle at the bottom of the screen or say "Hey Siri." Best for quick questions, setting reminders, making calls, and playing music.</li>
        <li data-en="ChatGPT — a free tool at chat.openai.com. Best for detailed explanations, writing help, recipes, and longer conversations." data-fr="ChatGPT — un outil gratuit sur chat.openai.com. Idéal pour les explications détaillées, l'aide à la rédaction, les recettes et les conversations plus longues.">ChatGPT — a free tool at chat.openai.com. Best for detailed explanations, writing help, recipes, and longer conversations.</li>
        <li data-en="Google Gemini — built into Google Search and available at gemini.google.com. Best if you already use Google and want AI answers alongside regular search results." data-fr="Google Gemini — intégré à la recherche Google et disponible sur gemini.google.com. Idéal si vous utilisez déjà Google et souhaitez des réponses IA en plus des résultats de recherche habituels.">Google Gemini — built into Google Search and available at gemini.google.com. Best if you already use Google and want AI answers alongside regular search results.</li>
        <li data-en="Alexa — Amazon's voice assistant. Found on Amazon Echo smart speakers. Best for home control (lights, timers, weather) and quick spoken questions." data-fr="Alexa — l'assistant vocal d'Amazon. Disponible sur les enceintes connectées Amazon Echo. Idéal pour le contrôle de la maison (lumières, minuteries, météo) et les questions vocales rapides.">Alexa — Amazon's voice assistant. Found on Amazon Echo smart speakers. Best for home control (lights, timers, weather) and quick spoken questions.</li>
      </ul>

      <div class="tip-block">
        <span class="tip-label" data-en="The 3-Second Rule" data-fr="La règle des 3 secondes">The 3-Second Rule</span>
        <p data-en="Before acting on anything an AI tells you, pause 3 seconds and ask yourself: 'Does this seem sensible? Should I check this somewhere else?' AI tools are helpful but not perfect. One quick check can save a lot of trouble." data-fr="Avant d'agir sur quelque chose qu'une IA vous dit, faites une pause de 3 secondes et demandez-vous : 'Est-ce que cela semble sensé ? Devrais-je vérifier ailleurs ?' Les outils d'IA sont utiles mais pas parfaits. Une vérification rapide peut éviter beaucoup de problèmes.">Before acting on anything an AI tells you, pause 3 seconds and ask yourself: "Does this seem sensible? Should I check this somewhere else?" AI tools are helpful but not perfect. One quick check can save a lot of trouble.</p>
      </div>

      <!-- ═══ SECTION 2: ASKING GOOD QUESTIONS ═══ -->
      <h2 data-en="2. Asking AI Good Questions" data-fr="2. Poser de bonnes questions à l'IA">2. Asking AI Good Questions</h2>

      <p data-en="The better your question, the better the answer. You do not need special knowledge — just write the way you would speak to another person." data-fr="Plus votre question est bonne, meilleure est la réponse. Vous n'avez pas besoin de connaissances spéciales — écrivez simplement comme vous parleriez à une autre personne.">The better your question, the better the answer. You do not need special knowledge — just write the way you would speak to another person.</p>

      <h3 data-en="Examples of Good Questions to Ask AI" data-fr="Exemples de bonnes questions à poser à l'IA">Examples of Good Questions to Ask AI</h3>
      <ul class="content-list">
        <li data-en="'What is a simple recipe for lentil soup that takes less than an hour?'" data-fr="'Quelle est une recette simple de soupe aux lentilles qui prend moins d'une heure ?'">"What is a simple recipe for lentil soup that takes less than an hour?"</li>
        <li data-en="'Can you explain what a blood pressure reading of 140/90 means in plain language?'" data-fr="'Pouvez-vous expliquer ce que signifie une tension artérielle de 140/90 en langage simple ?'">"Can you explain what a blood pressure reading of 140/90 means in plain language?"</li>
        <li data-en="'What are good questions to ask my pharmacist about drug interactions?'" data-fr="'Quelles sont les bonnes questions à poser à mon pharmacien sur les interactions médicamenteuses ?'">"What are good questions to ask my pharmacist about drug interactions?"</li>
        <li data-en="'What is the history of Woodstock, Ontario?'" data-fr="'Quelle est l'histoire de Woodstock, en Ontario ?'">"What is the history of Woodstock, Ontario?"</li>
        <li data-en="'Help me write a birthday message for my granddaughter who is turning 16.'" data-fr="'Aidez-moi à écrire un message d'anniversaire pour ma petite-fille qui a 16 ans.'">"Help me write a birthday message for my granddaughter who is turning 16."</li>
      </ul>

      <h3 data-en="Tips for Getting Better Answers" data-fr="Conseils pour obtenir de meilleures réponses">Tips for Getting Better Answers</h3>
      <ul class="content-list">
        <li data-en="Add 'in simple terms' or 'for someone who is not a doctor' to health questions" data-fr="Ajoutez 'en termes simples' ou 'pour quelqu'un qui n'est pas médecin' aux questions de santé">Add "in simple terms" or "for someone who is not a doctor" to health questions</li>
        <li data-en="If the answer is too long, type: 'Can you give me a shorter version?'" data-fr="Si la réponse est trop longue, tapez : 'Pouvez-vous me donner une version plus courte ?'">If the answer is too long, type: "Can you give me a shorter version?"</li>
        <li data-en="If the answer is confusing, type: 'Can you explain that with an example?'" data-fr="Si la réponse est confuse, tapez : 'Pouvez-vous expliquer cela avec un exemple ?'">If the answer is confusing, type: "Can you explain that with an example?"</li>
        <li data-en="You can ask follow-up questions in the same conversation — the AI remembers what you asked before" data-fr="Vous pouvez poser des questions de suivi dans la même conversation — l'IA se souvient de ce que vous avez demandé auparavant">You can ask follow-up questions in the same conversation — the AI remembers what you asked before</li>
        <li data-en="Specify your location when it matters: 'in Ontario' or 'in Canada' for local information" data-fr="Précisez votre emplacement quand c'est important : 'en Ontario' ou 'au Canada' pour les informations locales">Specify your location when it matters: "in Ontario" or "in Canada" for local information</li>
      </ul>

      <div class="confidence-check-box" role="note">
        <strong data-en="✅ Confidence Check" data-fr="✅ Vérification de confiance">✅ Confidence Check</strong><br>
        <span data-en="There are no wrong questions. If the first answer is not helpful, just rephrase it — like asking a librarian for clarification. AI does not judge, and it never gets tired of explaining things." data-fr="Il n'y a pas de mauvaises questions. Si la première réponse n'est pas utile, reformulez-la simplement — comme demander des éclaircissements à un bibliothécaire. L'IA ne juge pas et ne se lasse jamais d'expliquer les choses.">There are no wrong questions. If the first answer is not helpful, just rephrase it — like asking a librarian for clarification. AI does not judge, and it never gets tired of explaining things.</span>
      </div>

      <!-- ═══ SECTION 3: CHECKING AI ANSWERS ═══ -->
      <h2 data-en="3. Checking What AI Tells You" data-fr="3. Vérifier ce que l'IA vous dit">3. Checking What AI Tells You</h2>

      <p data-en="AI tools can make mistakes. They sometimes give outdated information, invent facts (this is called 'hallucination'), or misunderstand your question. That does not mean they are useless — it means you should treat their answers the way you would treat advice from a friend: helpful, but worth a second opinion." data-fr="Les outils d'IA peuvent se tromper. Ils donnent parfois des informations dépassées, inventent des faits (c'est ce qu'on appelle une 'hallucination') ou mal comprennent votre question. Cela ne signifie pas qu'ils sont inutiles — cela signifie que vous devriez traiter leurs réponses comme vous traiteriez les conseils d'un ami : utiles, mais qui méritent un deuxième avis.">AI tools can make mistakes. They sometimes give outdated information, invent facts (this is called "hallucination"), or misunderstand your question. That does not mean they are useless — it means you should treat their answers the way you would treat advice from a friend: helpful, but worth a second opinion.</p>

      <h3 data-en="Where to Double-Check Important Information" data-fr="Où vérifier les informations importantes">Where to Double-Check Important Information</h3>
      <ul class="content-list">
        <li data-en="Health questions: canada.ca/health, Mayo Clinic (mayoclinic.org), or your pharmacist" data-fr="Questions de santé : canada.ca/santé, Mayo Clinic (mayoclinic.org) ou votre pharmacien">Health questions: canada.ca/health, Mayo Clinic (mayoclinic.org), or your pharmacist</li>
        <li data-en="Government benefits: canada.ca or Service Canada (1-800-277-9914)" data-fr="Prestations gouvernementales : canada.ca ou Service Canada (1-800-277-9914)">Government benefits: canada.ca or Service Canada (1-800-277-9914)</li>
        <li data-en="Local news and events: your local newspaper's website" data-fr="Nouvelles et événements locaux : le site web de votre journal local">Local news and events: your local newspaper's website</li>
        <li data-en="Legal or financial questions: always consult a professional — AI is not a replacement for a lawyer or financial adviser" data-fr="Questions juridiques ou financières : consultez toujours un professionnel — l'IA ne remplace pas un avocat ou un conseiller financier">Legal or financial questions: always consult a professional — AI is not a replacement for a lawyer or financial adviser</li>
      </ul>

      <h3 data-en="Warning Signs That an AI Answer May Be Wrong" data-fr="Signes d'avertissement qu'une réponse d'IA pourrait être fausse">Warning Signs That an AI Answer May Be Wrong</h3>
      <ul class="content-list">
        <li data-en="The answer gives a very specific phone number, address, or dollar amount — always verify these independently" data-fr="La réponse donne un numéro de téléphone, une adresse ou un montant en dollars très précis — vérifiez toujours ces informations de manière indépendante">The answer gives a very specific phone number, address, or dollar amount — always verify these independently</li>
        <li data-en="The answer sounds too alarming or too reassuring about a health symptom" data-fr="La réponse semble trop alarmante ou trop rassurante à propos d'un symptôme de santé">The answer sounds too alarming or too reassuring about a health symptom</li>
        <li data-en="The AI seems very certain about something it could not possibly know (like what will happen in the future)" data-fr="L'IA semble très certaine de quelque chose qu'elle ne pourrait pas connaître (comme ce qui se passera à l'avenir)">The AI seems very certain about something it could not possibly know (like what will happen in the future)</li>
        <li data-en="The answer says 'as of my last update' or 'my training data' — this means it may not have current information" data-fr="La réponse dit 'selon ma dernière mise à jour' ou 'mes données d'entraînement' — cela signifie qu'elle peut ne pas avoir d'informations actuelles">The answer says "as of my last update" or "my training data" — this means it may not have current information</li>
      </ul>

      <div class="tip-block">
        <span class="tip-label" data-en="A Simple Checking Habit" data-fr="Une habitude de vérification simple">A Simple Checking Habit</span>
        <p data-en="For anything important, search the same question on Google. If the top two or three results from different websites agree with what the AI said, you can be more confident. If they disagree, trust the established websites over the AI." data-fr="Pour tout ce qui est important, recherchez la même question sur Google. Si les deux ou trois premiers résultats de différents sites web concordent avec ce que l'IA a dit, vous pouvez avoir plus confiance. S'ils ne sont pas d'accord, faites confiance aux sites web établis plutôt qu'à l'IA.">For anything important, search the same question on Google. If the top two or three results from different websites agree with what the AI said, you can be more confident. If they disagree, trust the established websites over the AI.</p>
      </div>

      <!-- ═══ SECTION 4: HEALTH INFORMATION AND AI ═══ -->
      <h2 data-en="4. Health Information and AI" data-fr="4. Informations de santé et IA">4. Health Information and AI</h2>

      <p data-en="Many people use AI to research health topics — and that is completely understandable. AI can explain medical words in plain language, help you think of questions for your doctor, and give you a general sense of what a condition or medication involves. But there are clear limits." data-fr="Beaucoup de personnes utilisent l'IA pour se renseigner sur des sujets de santé — et c'est tout à fait compréhensible. L'IA peut expliquer les termes médicaux en langage simple, vous aider à penser à des questions pour votre médecin et vous donner une idée générale de ce qu'implique une condition ou un médicament. Mais il y a des limites claires.">Many people use AI to research health topics — and that is completely understandable. AI can explain medical words in plain language, help you think of questions for your doctor, and give you a general sense of what a condition or medication involves. But there are clear limits.</p>

      <h3 data-en="Good Uses of AI for Health" data-fr="Bonnes utilisations de l'IA pour la santé">Good Uses of AI for Health</h3>
      <ul class="content-list">
        <li data-en="Ask AI to explain a medical term your doctor used that you did not fully understand" data-fr="Demandez à l'IA d'expliquer un terme médical que votre médecin a utilisé et que vous n'avez pas entièrement compris">Ask AI to explain a medical term your doctor used that you did not fully understand</li>
        <li data-en="Use AI to prepare a list of questions before a doctor's appointment" data-fr="Utilisez l'IA pour préparer une liste de questions avant un rendez-vous médical">Use AI to prepare a list of questions before a doctor's appointment</li>
        <li data-en="Ask about general side effects of a medication (then verify with your pharmacist)" data-fr="Renseignez-vous sur les effets secondaires généraux d'un médicament (puis vérifiez auprès de votre pharmacien)">Ask about general side effects of a medication (then verify with your pharmacist)</li>
        <li data-en="Get a plain-language summary of a health condition after your diagnosis" data-fr="Obtenez un résumé en langage simple d'une condition de santé après votre diagnostic">Get a plain-language summary of a health condition after your diagnosis</li>
      </ul>

      <h3 data-en="When AI Is Not Enough — Call a Professional" data-fr="Quand l'IA ne suffit pas — appelez un professionnel">When AI Is Not Enough — Call a Professional</h3>
      <ul class="content-list">
        <li data-en="You have a new or worsening symptom — call Telehealth Ontario free: 1-866-797-0000" data-fr="Vous avez un symptôme nouveau ou qui s'aggrave — appelez Télésanté Ontario gratuitement : 1-866-797-0000">You have a new or worsening symptom — call Telehealth Ontario free: 1-866-797-0000</li>
        <li data-en="You are considering stopping or changing a medication" data-fr="Vous envisagez d'arrêter ou de changer un médicament">You are considering stopping or changing a medication</li>
        <li data-en="You have chest pain, trouble breathing, sudden confusion, or severe pain — call 911" data-fr="Vous avez des douleurs thoraciques, des difficultés à respirer, une confusion soudaine ou des douleurs sévères — appelez le 911">You have chest pain, trouble breathing, sudden confusion, or severe pain — call 911</li>
        <li data-en="You want to know if a treatment or supplement is right for your specific situation" data-fr="Vous voulez savoir si un traitement ou un supplément convient à votre situation spécifique">You want to know if a treatment or supplement is right for your specific situation</li>
      </ul>

      <div class="confidence-check-box" role="note">
        <strong data-en="✅ Confidence Check" data-fr="✅ Vérification de confiance">✅ Confidence Check</strong><br>
        <span data-en="AI does not know your medical history, your other medications, your age, or your specific circumstances. Your pharmacist at a Canadian drugstore can answer most medication questions for free — walk in or call anytime." data-fr="L'IA ne connaît pas vos antécédents médicaux, vos autres médicaments, votre âge ou vos circonstances spécifiques. Votre pharmacien dans une pharmacie canadienne peut répondre à la plupart des questions sur les médicaments gratuitement — entrez ou appelez à n'importe quel moment.">AI does not know your medical history, your other medications, your age, or your specific circumstances. Your pharmacist at a Canadian drugstore can answer most medication questions for free — walk in or call anytime.</span>
      </div>

      <!-- ═══ SECTION 5: PROTECTING YOUR PRIVACY ═══ -->
      <h2 data-en="5. Protecting Your Privacy with AI" data-fr="5. Protéger votre vie privée avec l'IA">5. Protecting Your Privacy with AI</h2>

      <p data-en="When you type something into an AI tool, that information is sent to a company's computer servers. The company may store your conversation for months or years and may use it to improve their AI. This is normal — but it means you should be thoughtful about what you share." data-fr="Lorsque vous tapez quelque chose dans un outil d'IA, ces informations sont envoyées aux serveurs informatiques d'une entreprise. L'entreprise peut stocker votre conversation pendant des mois ou des années et peut l'utiliser pour améliorer son IA. C'est normal — mais cela signifie que vous devez réfléchir à ce que vous partagez.">When you type something into an AI tool, that information is sent to a company's computer servers. The company may store your conversation for months or years and may use it to improve their AI. This is normal — but it means you should be thoughtful about what you share.</p>

      <h3 data-en="Never Share These Things with AI" data-fr="Ne partagez jamais ces informations avec l'IA">Never Share These Things with AI</h3>
      <ul class="content-list">
        <li data-en="Your full name combined with your address, phone number, or birthdate" data-fr="Votre nom complet combiné avec votre adresse, numéro de téléphone ou date de naissance">Your full name combined with your address, phone number, or birthdate</li>
        <li data-en="Your Social Insurance Number (SIN) or health card number (OHIP)" data-fr="Votre numéro d'assurance sociale (NAS) ou votre numéro de carte santé (OHIP)">Your Social Insurance Number (SIN) or health card number (OHIP)</li>
        <li data-en="Banking details, credit card numbers, or online banking passwords" data-fr="Coordonnées bancaires, numéros de carte de crédit ou mots de passe de banque en ligne">Banking details, credit card numbers, or online banking passwords</li>
        <li data-en="Your daily routine or when your home is empty" data-fr="Votre routine quotidienne ou quand votre maison est vide">Your daily routine or when your home is empty</li>
        <li data-en="Passwords or PIN numbers of any kind" data-fr="Mots de passe ou codes PIN de toute nature">Passwords or PIN numbers of any kind</li>
      </ul>

      <h3 data-en="Safe Ways to Ask Personal Questions" data-fr="Façons sûres de poser des questions personnelles">Safe Ways to Ask Personal Questions</h3>
      <p data-en="Instead of typing 'I take 10mg of metformin and my doctor is Dr. Smith at St. Thomas hospital,' type: 'What are the general side effects of metformin?' You get the same useful answer without sharing personal details." data-fr="Au lieu de taper 'Je prends 10 mg de metformine et mon médecin est le Dr Smith à l'hôpital de St. Thomas,' tapez : 'Quels sont les effets secondaires généraux de la metformine ?' Vous obtenez la même réponse utile sans partager de détails personnels.">Instead of typing "I take 10mg of metformin and my doctor is Dr. Smith at St. Thomas hospital," type: "What are the general side effects of metformin?" You get the same useful answer without sharing personal details.</p>

      <div class="tip-block">
        <span class="tip-label" data-en="The Golden Rule for AI Privacy" data-fr="La règle d'or pour la confidentialité de l'IA">The Golden Rule for AI Privacy</span>
        <p data-en="Before typing anything into an AI tool, ask yourself: 'Would I be comfortable if this message was posted on a community bulletin board?' If the answer is no — leave that detail out." data-fr="Avant de taper quoi que ce soit dans un outil d'IA, demandez-vous : 'Serais-je à l'aise si ce message était affiché sur un tableau d'affichage communautaire ?' Si la réponse est non — laissez ce détail de côté.">Before typing anything into an AI tool, ask yourself: "Would I be comfortable if this message was posted on a community bulletin board?" If the answer is no — leave that detail out.</p>
      </div>

      <!-- ═══ SECTION 6: HELPFUL AI TOOLS FOR EVERYDAY LIFE ═══ -->
      <h2 data-en="6. Helpful AI Tools for Everyday Life" data-fr="6. Outils d'IA utiles pour la vie quotidienne">6. Helpful AI Tools for Everyday Life</h2>

      <p data-en="Once you are comfortable with the basics, AI can be a genuinely handy helper for all sorts of everyday tasks. Here are some ideas to try." data-fr="Une fois que vous êtes à l'aise avec les bases, l'IA peut être une aide vraiment pratique pour toutes sortes de tâches quotidiennes. Voici quelques idées à essayer.">Once you are comfortable with the basics, AI can be a genuinely handy helper for all sorts of everyday tasks. Here are some ideas to try.</p>

      <h3 data-en="Practical Things to Try With AI" data-fr="Choses pratiques à essayer avec l'IA">Practical Things to Try With AI</h3>
      <ul class="content-list">
        <li data-en="'Write a birthday card message for my brother who loves fishing and turning 70.'" data-fr="'Rédigez un message de carte d'anniversaire pour mon frère qui aime la pêche et fête ses 70 ans.'">"Write a birthday card message for my brother who loves fishing and turning 70."</li>
        <li data-en="'Translate this sentence into French: How do I get to the pharmacy?'" data-fr="'Traduire cette phrase en anglais : Comment puis-je aller à la pharmacie ?'">"Translate this sentence into French: How do I get to the pharmacy?"</li>
        <li data-en="'What are good indoor plants for a sunny Ontario apartment that are hard to kill?'" data-fr="'Quelles sont les bonnes plantes d'intérieur pour un appartement ensoleillé en Ontario qui sont difficiles à tuer ?'">"What are good indoor plants for a sunny Ontario apartment that are hard to kill?"</li>
        <li data-en="'Suggest some easy chair exercises for someone with knee pain.'" data-fr="'Suggérez quelques exercices faciles en chaise pour quelqu'un qui a des douleurs aux genoux.'">"Suggest some easy chair exercises for someone with knee pain."</li>
        <li data-en="'Help me write an email to my landlord asking about a repair that has not been fixed.'" data-fr="'Aidez-moi à écrire un courriel à mon propriétaire pour demander une réparation qui n'a pas été effectuée.'">"Help me write an email to my landlord asking about a repair that has not been fixed."</li>
        <li data-en="'What is the difference between RRSP and TFSA in Canada?' (then verify with your bank or a financial adviser)" data-fr="'Quelle est la différence entre REER et CELI au Canada ?' (puis vérifiez auprès de votre banque ou d'un conseiller financier)">"What is the difference between RRSP and TFSA in Canada?" (then verify with your bank or a financial adviser)</li>
        <li data-en="'What are good day trips from London, Ontario for a senior who loves history?'" data-fr="'Quelles sont les bonnes excursions d'une journée au départ de London, en Ontario, pour un aîné qui aime l'histoire ?'">"What are good day trips from London, Ontario for a senior who loves history?"</li>
      </ul>

      <h3 data-en="Using Siri on Your iPad Every Day" data-fr="Utiliser Siri sur votre iPad chaque jour">Using Siri on Your iPad Every Day</h3>
      <ul class="content-list">
        <li data-en="'Hey Siri, set a timer for 20 minutes.'" data-fr="'Dis Siri, règle un minuteur pour 20 minutes.'">"Hey Siri, set a timer for 20 minutes."</li>
        <li data-en="'Hey Siri, call my daughter.'" data-fr="'Dis Siri, appelle ma fille.'">"Hey Siri, call my daughter."</li>
        <li data-en="'Hey Siri, what is the weather in St. Thomas today?'" data-fr="'Dis Siri, quel temps fait-il à St. Thomas aujourd'hui ?'">"Hey Siri, what is the weather in St. Thomas today?"</li>
        <li data-en="'Hey Siri, remind me at 3pm to take my medication.'" data-fr="'Dis Siri, rappelle-moi à 15 h de prendre mes médicaments.'">"Hey Siri, remind me at 3pm to take my medication."</li>
        <li data-en="'Hey Siri, how do I get to the Elgin County Library?'" data-fr="'Dis Siri, comment me rendre à la bibliothèque du comté d'Elgin ?'">"Hey Siri, how do I get to the Elgin County Library?"</li>
      </ul>

      <div class="confidence-check-box" role="note">
        <strong data-en="✅ Final Confidence Check" data-fr="✅ Vérification de confiance finale">✅ Final Confidence Check</strong><br>
        <span data-en="You now know: what AI tools are and which ones you might use, how to ask good questions and get clearer answers, how to check whether AI answers are trustworthy, what personal information to keep private, and dozens of practical ways AI can help you in daily life. You have earned this." data-fr="Vous savez maintenant : ce que sont les outils d'IA et lesquels vous pourriez utiliser, comment poser de bonnes questions et obtenir des réponses plus claires, comment vérifier si les réponses de l'IA sont fiables, quelles informations personnelles garder privées et des dizaines de façons pratiques dont l'IA peut vous aider dans la vie quotidienne. Vous l'avez mérité.">You now know: what AI tools are and which ones you might use, how to ask good questions and get clearer answers, how to check whether AI answers are trustworthy, what personal information to keep private, and dozens of practical ways AI can help you in daily life. You have earned this.</span>
      </div>

      <div class="quick-answers-accordion" id="quick-answers">

        <div class="qa-item">
          <button class="qa-question" aria-expanded="false">
            <span>What is the difference between a search engine and an AI?</span>
