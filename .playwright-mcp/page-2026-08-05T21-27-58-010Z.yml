          - paragraph [ref=f1e136]:
            - link "Visitez la page d’accueil en français →" [ref=f1e137] [cursor=pointer]:
              - /url: fr/index.html
      - generic [ref=f1e138]:
        - heading "Our Place in the Digital Literacy Ecosystem" [level=2] [ref=f1e139]
        - paragraph [ref=f1e140]:
          - text: The Digital Confidence Centre joins a growing global movement to make technology accessible to adults who want more comfort and confidence with it. While organisations like UK-based
          - link "Cyber Collective (opens in a new tab)" [ref=f1e141] [cursor=pointer]:
            - /url: https://www.cybercollective.org
          - text: serve their communities internationally, we specialise in the Canadian experience — with seniors as a core audience.
        - paragraph [ref=f1e143]:
          - emphasis [ref=f1e144]: We are not reinventing the wheel — we are making it turn for Canadians who want to feel more confident online.
      - generic [ref=f1e145]:
        - heading "Built for Every Reader" [level=2] [ref=f1e146]
        - paragraph [ref=f1e147]: We've included several tools to make the course easier to read at any age or ability level. Look for the Display settings button at the top of every page.
        - generic [ref=f1e148]:
          - generic [ref=f1e149]: 🔡 Text Size
          - paragraph [ref=f1e150]:
            - text: Use the
            - strong [ref=f1e151]: A− A A+
            - text: buttons under Display settings to make the text as large as you need. Your choice is saved and remembered.
        - generic [ref=f1e152]:
          - generic [ref=f1e153]: 🌓 Dark Mode
          - paragraph [ref=f1e154]: Switch between light and dark backgrounds under Display settings. Dark mode reduces eye strain in low-light conditions. Both modes meet WCAG colour contrast requirements.
        - generic [ref=f1e155]:
          - generic [ref=f1e156]: 🔊 Read Aloud
          - paragraph [ref=f1e157]: Every page can read itself to you, at the speed you choose. Look for the Read aloud button under Display settings.
        - generic [ref=f1e158]:
          - generic [ref=f1e159]: 🖨️ Print Any Lesson
          - paragraph [ref=f1e160]: Print any page from your browser. Printed pages show only the lesson content — no menus, no buttons — formatted for clean, easy reading.
