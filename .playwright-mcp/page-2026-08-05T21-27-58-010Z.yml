      - heading "About Digital Confidence Centre" [level=1] [ref=f1e37]
      - generic [ref=f1e39]:
        - generic [ref=f1e40]: How It Started
        - paragraph [ref=f1e41]: "Digital Confidence Centre started with conversations, not a plan. Family members and loved ones kept saying the same things: they were struggling to keep up with technology, they wanted to feel more comfortable using different tools and apps, and they did not want to keep depending on someone else every time they got stuck. They wanted their independence back."
        - paragraph [ref=f1e42]: Those conversations sparked the idea for a course that is easy, flexible, and always evolving with the needs of people who feel like they're falling behind in a rapidly changing digital world — delivered in safe, plain-language, common-sense, practical terms.
        - paragraph [ref=f1e43]: Digital Confidence Centre was built directly from those conversations. Every module, every example, and every reassurance in this programme came from real concerns that real people shared with us.
      - generic [ref=f1e44]:
        - heading "Our Mission" [level=2] [ref=f1e45]
        - paragraph [ref=f1e47]:
          - emphasis [ref=f1e48]: "\"We believe every Canadian senior deserves to feel safe, confident, and connected in a digital world. Digital Confidence Centre exists to make that happen — one module at a time.\""
        - paragraph [ref=f1e49]: Digital Confidence Centre is a free, self-paced digital literacy programme for adults across Canada looking for digital literacy support, comfort, and independence — including, as a core audience, seniors. We believe that age should never be a barrier to participating safely in digital life — banking online, staying connected with family, or avoiding scams.
        - paragraph [ref=f1e50]:
          - text: "Our approach is built on a simple idea:"
          - strong [ref=f1e51]: sovereignty over autonomy
          - text: . We don't do things for people. We teach them to do things for themselves — with patience, plain language, and the reassurance that making mistakes is part of learning. When a learner finishes a module, they own that skill. It is theirs, not borrowed from a helpful family member who might not always be available.
        - generic [ref=f1e52]:
          - generic [ref=f1e53]: 🍁 Canada First
          - paragraph [ref=f1e54]:
            - text: Everything here is built for
            - emphasis [ref=f1e55]: your
            - text: life in Canada — your banks, your apps, your phone services, your scams. Not generic advice copied from somewhere else.
      - generic [ref=f1e56]:
        - heading "Why This Matters" [level=2] [ref=f1e57]
        - generic [ref=f1e58]:
          - generic [ref=f1e59]:
            - generic [ref=f1e60]: 👴
            - generic [ref=f1e61]: 1 in 5 Canadians is over 65
            - paragraph [ref=f1e62]: Canada's senior population is the fastest-growing demographic group in the country. By 2030, seniors will outnumber children. Digital literacy is not a niche concern — it is one of the most pressing public access issues of the decade.
          - generic [ref=f1e63]:
            - generic [ref=f1e64]: 💸
            - generic [ref=f1e65]: $500M+ lost to scams annually
            - paragraph [ref=f1e66]: According to the Canadian Anti-Fraud Centre, fraud losses reported by Canadians top half a billion dollars a year — and seniors are disproportionately targeted. Most victims report they didn't recognise the warning signs in time.
          - generic [ref=f1e67]:
            - generic [ref=f1e68]: 🧠
            - generic [ref=f1e69]: Digital isolation accelerates cognitive decline
            - paragraph [ref=f1e70]: Longitudinal research consistently links social and digital isolation in older adults to faster cognitive decline and higher rates of depression. Helping someone stay connected — via video call, email, or online community — is not just convenient. It is a health intervention.
        - paragraph [ref=f1e72]: Digital Confidence Centre is a direct response to all three of these realities. Not a product. Not a grant deliverable. A response.
      - generic [ref=f1e73]:
        - heading "Why Is This Free?" [level=2] [ref=f1e74]
        - paragraph [ref=f1e75]: The site is free because the whole point of this is to help people gain their independence without any boundaries. Digital literacy and comfort is something every Canadian should have access to. No agenda, no strings, no sales — just support to help you function in the rapidly changing world and keep up with the things that matter to you.
        - paragraph [ref=f1e76]: "The Digital Confidence Centre is funded through the time and care of Two Birds Innovation, a small Canadian product studio. This is DCC Essential: free to use, with no hidden fees and no personal data sold. Two Birds Innovation may, in future, offer a separate paid tier for institutions and libraries, called DCC Advanced. That would be new and separate. It would not change anything you can already access here for free."
      - generic [ref=f1e77]:
        - heading "What We Believe" [level=2] [ref=f1e78]
        - paragraph [ref=f1e79]: Five principles guide every decision we make about this programme.
        - generic [ref=f1e80]:
          - generic [ref=f1e81]:
            - generic [ref=f1e82]: 🧠
            - generic [ref=f1e83]: You're Not Too Old to Learn
            - paragraph [ref=f1e84]: Learning technology is not about age — it's about practice and patience. Adults who learned to drive, to use a microwave, or to operate a VCR have already proven they can learn new tools. A tablet is no different.
          - generic [ref=f1e85]:
            - generic [ref=f1e86]: 💛
            - generic [ref=f1e87]: Fear is Valid
            - paragraph [ref=f1e88]: We never dismiss concerns as overreaction. The fears our learners share — being scammed, making irreversible mistakes, embarrassing themselves — are completely reasonable. We take them seriously and address them directly.
          - generic [ref=f1e89]:
            - generic [ref=f1e90]: 🕰️
            - generic [ref=f1e91]: Dignity Over Speed
            - paragraph [ref=f1e92]: There is no deadline here. No one is grading your speed. This programme goes at whatever pace works for you, and you can revisit any module as many times as you like. Confidence cannot be rushed.
          - generic [ref=f1e93]:
            - generic [ref=f1e94]: 🗣️
            - generic [ref=f1e95]: Real Voices
            - paragraph [ref=f1e96]: Every lesson was shaped by conversations with real learners — seniors and other adults alike — not assumptions about what they need. We keep returning to our community to make sure we're still getting it right.
          - generic [ref=f1e97]:
            - generic [ref=f1e98]: 🍁
            - generic [ref=f1e99]: Canada First
            - paragraph [ref=f1e100]: Phone numbers, apps, banking advice, scam warnings — everything here is specific to life in Canada. We are not a global platform with Canadian content bolted on. We are built for here, by people who live here.
      - generic [ref=f1e101]:
        - heading "Who This Helps" [level=2] [ref=f1e102]
        - paragraph [ref=f1e103]: Digital Confidence Centre was designed for anyone who feels uncertain about technology — but these are the five groups who have told us it helps them most.
        - list [ref=f1e104]:
          - listitem [ref=f1e105]:
            - strong [ref=f1e106]: Recently retired adults
            - text: Stepping away from a workplace means losing the IT desk and the colleagues you could ask. This programme gives you that safety net back, without the embarrassment.
          - listitem [ref=f1e107]:
            - strong [ref=f1e108]: People who've been targeted by scams
            - text: If you've received a threatening phone call, a suspicious email, or a too-good-to-be-true offer, this programme walks you through exactly what happened — and how to stay safe.
          - listitem [ref=f1e109]:
            - strong [ref=f1e110]: Seniors moving toward digital banking
            - text: Bank branches are closing across Canada. If you're being pushed toward an app or website, our banking lesson walks you through it clearly and safely.
          - listitem [ref=f1e111]:
            - strong [ref=f1e112]: Caregivers setting up devices for a loved one
            - text: The
            - link "For families page" [ref=f1e113] [cursor=pointer]:
              - /url: for-families.html
            - text: helps you send a parent their first lesson — with the right reassurances from day one.
          - listitem [ref=f1e114]:
            - strong [ref=f1e115]: Adults learning at their own pace
            - text: Whether you have an hour a week or an hour a day, you can move through this programme entirely on your schedule. Progress is saved automatically, on your own device.
      - generic [ref=f1e116]:
        - heading "What You'll Learn" [level=2] [ref=f1e117]
        - paragraph [ref=f1e118]: The programme's 29 modules cover the digital skills that matter most for everyday life in Canada.
        - generic [ref=f1e119]:
          - generic [ref=f1e120]: 📚 29 Modules
          - paragraph [ref=f1e121]: From the very basics — how to get back to your home screen when you're lost — all the way through banking, video calls, grocery delivery, ride-sharing, and getting help with confidence when something goes wrong.
        - generic [ref=f1e122]:
          - generic [ref=f1e123]: 🤝 Practice Spotting Scams
          - paragraph [ref=f1e124]:
            - text: Practise recognising real-world scam scenarios before you encounter them in real life — grandparent scams, fake banking texts, CRA robocalls, tech support pop-ups, and more. Start with
            - 'link "Practice: Spot the Scam" [ref=f1e125] [cursor=pointer]':
              - /url: scam-defence-helper.html
            - text: .
        - generic [ref=f1e126]:
          - generic [ref=f1e127]: 🏆 Completion Certificate
          - paragraph [ref=f1e128]:
            - text: After completing the modules and the
            - link "final assessment" [ref=f1e129] [cursor=pointer]:
              - /url: final-quiz.html
            - text: ", you'll receive a printable Digital Confidence Certificate. It's a real achievement worth celebrating."
      - generic [ref=f1e130]:
        - heading "Now arriving in French — Maintenant en français" [level=2] [ref=f1e131]
        - generic [ref=f1e132]:
          - generic [ref=f1e133]: ⚜ Bilingual Commitment
          - paragraph [ref=f1e134]:
            - text: The French-language version of Digital Confidence Centre is being built lesson by lesson — natural, respectful Canadian French written for Canada's Francophone community, never raw machine translation. The
            - link "French home page" [ref=f1e135] [cursor=pointer]:
