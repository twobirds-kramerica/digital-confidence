        - generic [ref=f1e163]:
          - paragraph [ref=f1e164]: "Digital Confidence Centre is built by Two Birds Innovation, a small Canadian product studio. Our team has worked across large corporate enterprises, retail, telecom, non-profit, and business services — experience in innovation, product, and category management now put toward one goal: making technology genuinely accessible to the people who need it most."
          - paragraph [ref=f1e165]: Every module on this site is grounded in real conversations, not assumptions, and is reviewed and updated regularly to reflect current threats, apps, and Canadian resources.
