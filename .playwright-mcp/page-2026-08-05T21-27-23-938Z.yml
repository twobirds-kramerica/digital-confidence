      - heading "Photos and Memories" [level=1] [ref=e43]
      - paragraph [ref=e44]:
        - generic [ref=e45]: ⏱
        - text: About 15 minutes, at your own pace
      - paragraph [ref=e46]:
        - generic [ref=e47]: ✅
        - text: You are in a safe place. Nothing on this page can harm your device.
      - paragraph [ref=e48]: The fun stuff. Your device is not just a tool for email and banking. It is a canvas for creativity, a photo album that never fills up, and a window into art and music. This module is about discovering joy in your device.
      - heading "Betty's story" [level=2] [ref=e49]
      - paragraph [ref=e50]: Betty, 78, had always loved painting watercolours. When arthritis made it harder to hold a brush, she thought her painting days were over. Then her granddaughter showed her a drawing app on the iPad.
      - paragraph [ref=e51]: "\"At first I thought it was silly, painting with your finger on a piece of glass,\" Betty laughs. \"But then I discovered you could choose any colour instantly, undo a mistake with one tap, and zoom in to add tiny details. I painted my first digital watercolour that afternoon, a cardinal sitting on the fence in my backyard.\""
      - paragraph [ref=e52]: Betty now paints on her iPad every evening after dinner. She emails her paintings to friends, prints them out as greeting cards, and recently started an online gallery that her grandchildren helped her set up. "This little device gave me my art back," she says.
      - generic [ref=e55]:
        - generic [ref=e56]: From your coach
        - paragraph [ref=e57]: "Many people avoid touching their photos because they are afraid of deleting a memory they cannot get back. That fear is an act of love, not a weakness. The good news: deleted photos sit in a recovery folder for 30 days, so even a wrong tap is reversible. Your memories are safer than you think."
      - generic [ref=e58]:
        - generic [ref=e59]: Tip
        - paragraph [ref=e60]: You do not need an expensive camera. The camera on your device takes wonderful photos. The best camera is the one you have with you.
      - heading "Taking great photos with your device" [level=2] [ref=e61]
      - generic [ref=e62]:
        - heading "Taking a photo" [level=4] [ref=e63]
        - generic [ref=e64]:
          - generic [ref=e65]: "1"
          - paragraph [ref=e67]:
            - text: Find the
            - strong [ref=e68]: Camera
            - text: app on your Home screen. On an iPad or iPhone it looks like a simple camera icon on a grey background. On Android it usually says "Camera".
        - generic [ref=e69]:
          - generic [ref=e70]: "2"
          - paragraph [ref=e72]: Point your device at what you want to photograph. The screen shows what the camera sees.
        - generic [ref=e73]:
          - generic [ref=e74]: "3"
          - paragraph [ref=e76]:
            - text: Tap the large
            - strong [ref=e77]: round button
            - text: at the bottom of the screen. That is the shutter button. It takes the photo.
        - generic [ref=e78]:
          - generic [ref=e79]: "4"
          - paragraph [ref=e81]:
            - text: "Your photo is automatically saved: in the"
            - strong [ref=e82]: Photos
            - text: app on Apple devices, or in
            - strong [ref=e83]: Google Photos
            - text: or your device's
            - strong [ref=e84]: Gallery
            - text: app on Android.
      - generic [ref=e85]:
        - generic [ref=e86]: Photo tips for better pictures
        - paragraph [ref=e87]:
          - strong [ref=e88]: "Hold steady:"
          - text: rest your elbows on a table or hold your device with both hands. Shaky hands mean blurry photos.
          - strong [ref=e89]: "Use natural light:"
          - text: photos taken near a window or outside in daylight look much better than photos taken under indoor lighting.
          - strong [ref=e90]: "Tap to focus:"
          - text: if you want to photograph something specific (like a flower in a garden), tap on that object on your screen. The camera will adjust to make that object sharp and clear.
          - strong [ref=e91]: "Clean the lens:"
          - text: the tiny camera lens on the back of your device can get smudged by fingerprints. Gently wipe it with a soft cloth before taking photos.
      - generic [ref=e92]:
        - generic [ref=e93]: Confidence check
        - paragraph [ref=e94]: You have a camera in your hands right now. Every moment is an opportunity to capture something beautiful. Now let us make those photos look even better.
      - heading "Editing your photos" [level=2] [ref=e95]
      - paragraph [ref=e96]:
        - text: "Your device comes with built-in photo editing tools that are surprisingly powerful. You do not need any extra apps: use the"
        - strong [ref=e97]: Photos
        - text: app on an iPad or iPhone, or
        - strong [ref=e98]: Google Photos
        - text: on Android.
      - generic [ref=e99]:
        - heading "Basic photo editing" [level=4] [ref=e100]
        - generic [ref=e101]:
          - generic [ref=e102]: "1"
          - paragraph [ref=e104]:
            - text: Open the
            - strong [ref=e105]: Photos
            - text: app (colourful flower icon) on Apple, or
            - strong [ref=e106]: Google Photos
            - text: (colourful pinwheel icon) on Android.
        - generic [ref=e107]:
          - generic [ref=e108]: "2"
          - paragraph [ref=e110]: Tap the photo you want to edit.
        - generic [ref=e111]:
          - generic [ref=e112]: "3"
          - paragraph [ref=e114]:
            - text: Tap
            - strong [ref=e115]: "\"Edit\""
            - text: . On Apple it is in the top-right corner; on Android it looks like a set of sliders at the bottom.
        - generic [ref=e116]:
          - generic [ref=e117]: "4"
          - paragraph [ref=e119]:
            - text: "You will see several tools:"
            - strong [ref=e120]: Auto-Enhance
            - text: (the magic wand on Apple, or "Enhance" under Suggestions in Google Photos) lets your device automatically improve the photo. This is often the best first step.
            - strong [ref=e121]: Crop
            - text: (square icon) cuts away parts of the photo you do not want.
            - strong [ref=e122]: Filters
            - text: add artistic effects like black and white.
            - strong [ref=e123]: Adjust
            - text: changes brightness, contrast, and colour.
        - generic [ref=e124]:
          - generic [ref=e125]: "5"
          - paragraph [ref=e127]:
            - text: When you are happy with your edits, tap
            - strong [ref=e128]: "\"Done\""
            - text: (Apple) or
            - strong [ref=e129]: "\"Save copy\""
            - text: (Google Photos, which keeps your original safe).
        - generic [ref=e130]:
          - generic [ref=e131]: "6"
          - paragraph [ref=e133]:
            - text: Changed your mind? You can always go back to Edit and tap
            - strong [ref=e134]: "\"Revert\""
            - text: to undo all changes and return to the original photo. Nothing is permanent.
      - generic [ref=e135]:
        - generic [ref=e136]: Tip
        - paragraph [ref=e137]: Photo editing is non-destructive. Your original photo is always saved, and you can always undo any edits by tapping "Revert to Original". So experiment freely.
      - heading "Organizing your photos" [level=2] [ref=e138]
      - paragraph [ref=e139]: "As you take more photos, you will want to keep them organised. Here are some helpful features built into the Photos app and Google Photos:"
      - list [ref=e140]:
        - listitem [ref=e141]:
          - strong [ref=e142]: "Albums:"
          - text: you can create albums to group photos together, like "Garden 2025", "Grandchildren", or "Recipes". On Apple, tap the
          - strong [ref=e143]: Albums
          - text: tab, then the
          - strong [ref=e144]: "\"+\""
          - text: button. In Google Photos, tap the
          - strong [ref=e145]: Library
          - text: tab, then
          - strong [ref=e146]: "\"New album\""
          - text: .
        - listitem [ref=e147]:
          - strong [ref=e148]: "Favourites:"
          - text: when viewing a photo, tap the
          - strong [ref=e149]: heart icon
          - text: (Apple) or
          - strong [ref=e150]: star icon
          - text: (Google Photos) to mark it as a favourite. All your favourites appear in a special "Favourites" album for quick access.
        - listitem [ref=e151]:
          - strong [ref=e152]: "Search:"
          - text: your photo app can recognise what is in your photos. Tap
          - strong [ref=e153]: Search
          - text: and type something like "beach" or "birthday" or even "dog", and it will find matching photos.
        - listitem [ref=e154]:
          - strong [ref=e155]: "Memories:"
          - text: your device automatically creates slideshows from your photos, set to music. On Apple, look for the
          - strong [ref=e156]: "\"For You\""
          - text: tab. In Google Photos, look at the top of the main screen. They can be quite lovely.
      - generic [ref=e157]:
        - generic [ref=e158]: Confidence check
        - paragraph [ref=e159]: Your photos are treasures, and now you know how to take them, improve them, and keep them organised. Well done.
      - heading "Drawing and painting apps" [level=2] [ref=e160]
      - paragraph [ref=e161]: "Your device is a wonderful tool for drawing, painting, and creating art. Here are some apps to explore:"
      - list [ref=e162]:
        - listitem [ref=e163]:
          - strong [ref=e164]: Paper by WeTransfer
          - text: "(free, App Store, developer WeTransfer BV): a beautiful, simple drawing app. Swipe to turn pages, draw with your finger, and choose from pencils, pens, markers, and watercolour brushes. Perfect for sketching and doodling."
        - listitem [ref=e165]:
          - strong [ref=e166]: Ibis Paint X
          - text: "(free, Play Store, developer ibis inc.): a popular and beginner-friendly drawing app for Android with many brushes, pens, and tools. One of the most-loved free art apps on Android."
        - listitem [ref=e167]:
          - strong [ref=e168]: Tayasui Sketches
          - text: "(free version available, App Store and Play Store, developer Tayasui): incredibly realistic art tools. The watercolour brush actually behaves like real watercolour paint, blending and spreading on the digital \"paper\". Betty's favourite app."
        - listitem [ref=e169]:
          - strong [ref=e170]: Colouring books for adults
          - text: "(various, free): search the App Store or Play Store for \"adult colouring\" to find relaxing colouring book apps. Tap to fill in areas with colour, choose from hundreds of patterns, and save your creations."
      - generic [ref=e171]:
        - generic [ref=e172]: Watch out
        - paragraph [ref=e173]: When downloading creative apps, always use the official App Store or Play Store. Some "free" art apps contain ads or hidden subscriptions. Check the reviews and developer name first.
      - heading "Making greeting cards and collages" [level=2] [ref=e174]
      - paragraph [ref=e175]: "Your photos can become beautiful greeting cards, collages, and gifts:"
      - list [ref=e176]:
        - listitem [ref=e177]:
          - strong [ref=e178]: The Photos app
          - text: itself can create printed books, calendars, and cards. Look for the share button and options to print or order prints. In
          - strong [ref=e179]: Google Photos
          - text: ", check the Library tab and look for \"Utilities\" to find options for creating collages and movies."
        - listitem [ref=e180]:
          - strong [ref=e181]: Canva
          - text: (free, App Store and Play Store, developer Canva) is an app with thousands of templates for cards, invitations, posters, and social media posts.
        - listitem [ref=e182]:
          - strong [ref=e183]: "Print at home:"
          - text: if you have a printer, you can print photos directly from your photo app. On Apple, tap the share button (square with upward arrow) and select
          - strong [ref=e184]: "\"Print\""
          - text: . In Google Photos, tap the three dots menu on any photo and select "Print".
      - heading "Listening to music and audiobooks" [level=2] [ref=e185]
      - paragraph [ref=e186]: "Your device is also a wonderful entertainment device:"
      - list [ref=e187]:
        - listitem [ref=e188]:
          - strong [ref=e189]: "Apple Music:"
          - text: access millions of songs. If you have an Apple Music subscription, open the
          - strong [ref=e190]: Music
          - text: app and search for your favourite artists or decades (try "1960s hits" or "classical piano").
        - listitem [ref=e191]:
          - strong [ref=e192]: "Apple Books:"
          - text: read e-books or listen to audiobooks. The
          - strong [ref=e193]: Books
          - text: app (orange icon with a book) lets you adjust text size, and audiobooks are wonderful for when your eyes need a rest.
        - listitem [ref=e194]:
          - strong [ref=e195]: "Podcasts:"
          - text: the purple
          - strong [ref=e196]: Podcasts
          - text: app has thousands of free shows on every topic imaginable. Search for "gardening", "history", "mystery stories", or anything else that interests you.
