            - generic [ref=f2e509]: De base
            - paragraph [ref=f2e510]: "Le nom que vous utilisez pour vous identifier en vous connectant à un site Web ou à une appli — souvent votre adresse courriel, mais parfois un surnom que vous avez choisi en vous inscrivant. C'est différent de votre mot de passe : votre nom d'utilisateur dit qui vous êtes, alors que votre mot de passe le prouve."
      - generic [ref=f2e511]:
        - generic [ref=f2e512]: V
        - generic [ref=f2e513]:
          - generic [ref=f2e514]:
            - generic [ref=f2e515]: Hameçonnage vocal (vishing)
            - generic [ref=f2e516]: Sécurité
            - paragraph [ref=f2e517]: Une arnaque par appel téléphonique où quelqu'un prétend représenter un vrai organisme (comme votre banque ou l'ARC) pour vous tromper et obtenir des renseignements personnels. Le terme anglais « vishing » vient de « voice phishing ».
          - generic [ref=f2e518]:
            - generic [ref=f2e519]: Assistant vocal
            - generic [ref=f2e520]: Service
            - paragraph [ref=f2e521]: Un logiciel qui répond à des commandes parlées. Alexa d'Amazon, Siri d'Apple et l'Assistant Google en sont des exemples. Vous pouvez leur demander de régler une minuterie, de jouer de la musique, de répondre à des questions, et de contrôler des appareils domestiques intelligents.
          - generic [ref=f2e522]:
            - generic [ref=f2e523]: RPV (réseau privé virtuel)
            - generic [ref=f2e524]: Sécurité
            - paragraph [ref=f2e525]: Signifie « réseau privé virtuel » — un outil qui crée un tunnel sécurisé et privé pour votre trafic Internet, le cachant des autres personnes sur le même réseau Wi-Fi. Utile en utilisant un Wi-Fi public (dans un café ou une bibliothèque). Pas essentiel à la maison, mais ajoute une couche de confidentialité supplémentaire à l'extérieur.
          - generic [ref=f2e526]:
            - generic [ref=f2e527]: Virus
            - generic [ref=f2e528]: Sécurité
            - paragraph [ref=f2e529]: Un programme nuisible capable de se copier lui-même et de se propager à d'autres appareils, causant souvent des dommages ou volant de l'information — nommé d'après les virus biologiques, car ils se propagent d'une façon semblable. Les iPhone et les iPad résistent très bien aux virus quand vous ne téléchargez des applis que depuis l'App Store officiel.
      - generic [ref=f2e530]:
        - generic [ref=f2e531]: W
        - generic [ref=f2e532]:
          - generic [ref=f2e533]:
            - generic [ref=f2e534]: WhatsApp
            - generic [ref=f2e535]: Service
            - paragraph [ref=f2e536]: Une appli de messagerie gratuite qui vous permet d'envoyer des textos, des photos et des messages vocaux, et de faire des appels vocaux ou vidéo — le tout par Wi-Fi ou données mobiles, partout dans le monde. Très populaire pour rester en contact avec de la famille outre-mer, sans frais interurbains. Les messages sont chiffrés pour votre confidentialité.
          - generic [ref=f2e537]:
            - generic [ref=f2e538]: Wi-Fi
            - generic [ref=f2e539]: De base
            - paragraph [ref=f2e540]: Une connexion Internet sans fil qui provient d'un routeur — la petite boîte que votre fournisseur d'accès Internet a installée chez vous. En vous connectant au Wi-Fi, votre appareil peut accéder à Internet sans utiliser les données de votre forfait téléphonique. Connectez-vous toujours à votre Wi-Fi à la maison avant de naviguer ou de regarder des vidéos.
          - generic [ref=f2e541]:
            - generic [ref=f2e542]: Widget (module)
            - generic [ref=f2e543]: Intermédiaire
            - paragraph [ref=f2e544]: Un petit panneau interactif que vous pouvez ajouter à votre écran d'accueil pour voir de l'information utile en un coup d'œil — comme la météo du jour, votre calendrier ou l'heure — sans ouvrir l'appli complète. Sur un iPad, appuyez et tenez l'écran d'accueil pour entrer en « mode tremblotant », puis touchez le bouton « + » pour ajouter des widgets.
      - generic [ref=f2e545]:
        - generic [ref=f2e546]: "Y"
        - generic [ref=f2e548]:
          - generic [ref=f2e549]: YouTube
          - generic [ref=f2e550]: Service
          - paragraph [ref=f2e551]: Un site Web et une appli gratuits (appartenant à Google) où n'importe qui peut regarder ou publier des vidéos. Vous pouvez y trouver des vidéos explicatives, des documentaires, de la musique, des recettes, des cours d'exercice, et bien plus encore. La version de base est gratuite avec quelques publicités; YouTube Premium retire les publicités moyennant des frais mensuels.
      - generic [ref=f2e552]:
        - generic [ref=f2e553]: Z
        - generic [ref=f2e554]:
          - generic [ref=f2e555]:
            - generic [ref=f2e556]: Zoom
            - generic [ref=f2e557]: Service
            - paragraph [ref=f2e558]: Une appli d'appels vidéo gratuite largement utilisée pour les réunions, les rassemblements familiaux et les cours. Vous pouvez rejoindre une réunion Zoom en appuyant sur un lien que quelqu'un vous envoie — vous n'avez pas besoin de compte pour rejoindre la réunion d'une autre personne. Le forfait gratuit permet des appels individuels illimités et des appels de groupe jusqu'à 40 minutes.
          - generic [ref=f2e559]:
            - generic [ref=f2e560]: Zoom (pincer pour zoomer)
            - generic [ref=f2e561]: Intermédiaire
            - paragraph [ref=f2e562]: Un geste sur écran tactile pour agrandir des éléments à l'écran. Placez deux doigts ensemble sur l'écran et écartez-les pour zoomer (agrandir), ou rapprochez-les pour dézoomer (rapetisser). Fonctionne dans les photos, les cartes, les pages Web et la plupart des applis. Vous pouvez toujours dézoomer pour revenir à la vue normale.
