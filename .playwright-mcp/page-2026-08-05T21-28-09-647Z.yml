      - generic [ref=f2e67]:
        - generic [ref=f2e68]: A
        - generic [ref=f2e69]:
          - generic [ref=f2e70]:
            - generic [ref=f2e71]: Appli
            - generic [ref=f2e72]: De base
            - paragraph [ref=f2e73]: Abréviation d'« application » — un programme sur lequel vous appuyez pour l'ouvrir sur votre téléphone ou votre tablette. La météo, les services bancaires, les cartes et les jeux sont tous des applis. Voyez-les comme de petits outils, chacun conçu pour une tâche précise.
          - generic [ref=f2e74]:
            - generic [ref=f2e75]: App Store
            - generic [ref=f2e76]: Service
            - paragraph [ref=f2e77]: La boutique officielle d'Apple pour télécharger des applis sur votre iPhone ou iPad. Chaque appli de l'App Store a été vérifiée par Apple pour votre sécurité. Téléchargez toujours à partir d'ici — jamais d'un site Web inconnu.
          - generic [ref=f2e78]:
            - generic [ref=f2e79]: Pièce jointe
            - generic [ref=f2e80]: De base
            - paragraph [ref=f2e81]: "Un fichier (comme une photo, un document ou un PDF) envoyé avec un courriel — un peu comme une lettre avec une photo glissée à l'intérieur. Soyez prudent avant d'ouvrir une pièce jointe venant d'une personne que vous ne connaissez pas : certaines contiennent des programmes nuisibles."
          - generic [ref=f2e82]:
            - generic [ref=f2e83]: IA (intelligence artificielle)
            - generic [ref=f2e84]: De base
            - paragraph [ref=f2e85]: "Un logiciel conçu pour faire des choses qui demandaient autrefois une personne — répondre à des questions, reconnaître un visage sur une photo, suggérer ce que vous vous apprêtez à taper. Vous l'avez probablement déjà utilisée sans le savoir : l'assistant de votre téléphone, le filtre à pourriel de votre courriel et les suggestions d'une appli de visionnement sont tous de l'IA. C'est un outil, pas une personne — elle ne pense pas et ne ressent rien comme vous."
          - generic [ref=f2e86]:
            - generic [ref=f2e87]: Antivirus
            - generic [ref=f2e88]: Sécurité
            - paragraph [ref=f2e89]: Un logiciel qui surveille votre appareil et cherche les programmes nuisibles (virus) qui tentent de s'y glisser. Les iPhone et les iPad offrent une forte protection intégrée, si bien qu'une appli antivirus distincte n'est habituellement pas nécessaire sur les appareils Apple.
          - generic [ref=f2e90]:
            - generic [ref=f2e91]: Algorithme
            - generic [ref=f2e92]: Intermédiaire
            - paragraph [ref=f2e93]: Une série d'instructions qu'un ordinateur suit pour prendre une décision — un peu comme une recette. Les réseaux sociaux utilisent des algorithmes pour choisir quelles publications vous montrer en premier, selon ce que vous avez aimé ou regardé auparavant.
          - generic [ref=f2e94]:
            - generic [ref=f2e95]: Authentification
            - generic [ref=f2e96]: Sécurité
            - paragraph [ref=f2e97]: Le fait de prouver qui vous êtes à un site Web ou à une appli — habituellement en entrant un mot de passe, en utilisant votre empreinte digitale ou en entrant un code reçu sur votre téléphone. C'est l'équivalent numérique de montrer une pièce d'identité à la banque.
      - generic [ref=f2e98]:
        - generic [ref=f2e99]: B
        - generic [ref=f2e100]:
          - generic [ref=f2e101]:
            - generic [ref=f2e102]: Sauvegarde
            - generic [ref=f2e103]: De base
            - paragraph [ref=f2e104]: Une copie de vos photos, de vos contacts et d'autres renseignements importants, enregistrée en lieu sûr — comme dans iCloud ou sur un disque externe. Si votre appareil est perdu ou brisé, une sauvegarde vous permet de tout récupérer.
          - generic [ref=f2e105]:
            - generic [ref=f2e106]: Bande passante
            - generic [ref=f2e107]: Intermédiaire
            - paragraph [ref=f2e108]: La quantité d'information que votre connexion Internet peut transporter à la fois — comme la largeur d'un tuyau. Un tuyau plus large (une bande passante plus grande) veut dire un Internet plus rapide et des appels vidéo plus fluides. Si votre appel vidéo gèle sans arrêt, une bande passante limitée peut en être la cause.
          - generic [ref=f2e109]:
            - generic [ref=f2e110]: Bluetooth
            - generic [ref=f2e111]: De base
            - paragraph [ref=f2e112]: Une connexion sans fil qui permet à deux appareils proches de communiquer entre eux — comme votre téléphone et des écouteurs sans fil, ou une prothèse auditive. Elle ne fonctionne que sur une courte distance (environ 10 mètres) et n'utilise pas vos données Internet.
          - generic [ref=f2e113]:
            - generic [ref=f2e114]: Navigateur
            - generic [ref=f2e115]: De base
            - paragraph [ref=f2e116]: L'appli que vous utilisez pour visiter des sites Web — comme Safari (le navigateur intégré d'Apple) ou Google Chrome. Vous tapez une adresse Web dans le navigateur, et il va chercher la page et l'affiche pour vous.
      - generic [ref=f2e117]:
        - generic [ref=f2e118]: C
        - generic [ref=f2e119]:
          - generic [ref=f2e120]:
            - generic [ref=f2e121]: Cache
            - generic [ref=f2e122]: Intermédiaire
            - paragraph [ref=f2e123]: Une réserve temporaire de renseignements de sites Web que votre appareil enregistre pour que les pages se chargent plus vite à votre prochaine visite — comme mettre une recette de côté pour ne pas avoir à la rechercher. Vider le cache (effacer ces données enregistrées) peut réparer une page qui a l'air brisée ou qui ne se charge pas bien.
          - generic [ref=f2e124]:
            - generic [ref=f2e125]: Robot conversationnel
            - generic [ref=f2e126]: Intermédiaire
            - paragraph [ref=f2e127]: Un programme informatique qui tient une conversation écrite avec vous. Certains robots conversationnels sont simples (ils suivent un script), d'autres utilisent l'IA et peuvent répondre à presque n'importe quelle question.
          - generic [ref=f2e128]:
            - generic [ref=f2e129]: Stockage infonuagique
            - generic [ref=f2e130]: Service
            - paragraph [ref=f2e131]: Enregistrer vos fichiers (photos, documents) sur des ordinateurs à distance appartenant à Apple, Google ou Microsoft, plutôt que seulement sur votre propre appareil. Vos fichiers restent en sécurité même si votre téléphone se brise.
          - generic [ref=f2e132]:
            - generic [ref=f2e133]: Infonuagique (le nuage)
            - generic [ref=f2e134]: De base
            - paragraph [ref=f2e135]: Un espace de stockage sur les ordinateurs d'une entreprise, accessible par Internet. Quand vos photos « se sauvegardent dans le nuage », elles sont enregistrées sur les ordinateurs sécurisés d'Apple — pas seulement sur votre appareil. Elles restent donc en sécurité même si votre iPad se brise.
          - generic [ref=f2e136]:
            - generic [ref=f2e137]: Paiement sans contact
            - generic [ref=f2e138]: Service
            - paragraph [ref=f2e139]: Payer en approchant votre carte ou votre téléphone d'un terminal de paiement, sans l'insérer ni le glisser. Sûr et pratique pour les achats de moins de 250 $ au Canada.
          - generic [ref=f2e140]:
            - generic [ref=f2e141]: Témoin (cookie)
            - generic [ref=f2e142]: Intermédiaire
            - paragraph [ref=f2e143]: Un tout petit fichier texte qu'un site Web enregistre sur votre appareil pour se souvenir de vous — comme un tampon sur la main dans une foire. Il peut se rappeler votre langue préférée ou vous garder connecté. Les témoins sont généralement sans danger, mais les sites Web doivent maintenant vous demander la permission de les utiliser.
          - generic [ref=f2e144]:
            - generic [ref=f2e145]: Bourrage d'identifiants
            - generic [ref=f2e146]: Sécurité
            - paragraph [ref=f2e147]: Quand des criminels prennent des combinaisons de nom d'utilisateur et de mot de passe volées lors d'une fuite de données et les essaient sur beaucoup d'autres sites Web. C'est pourquoi utiliser le même mot de passe sur plusieurs sites est dangereux.
          - generic [ref=f2e148]:
            - generic [ref=f2e149]: Curseur
            - generic [ref=f2e150]: De base
            - paragraph [ref=f2e151]: La petite flèche ou la ligne clignotante sur un écran d'ordinateur qui montre où vous pointez ou tapez. Sur un écran tactile, votre doigt agit comme le curseur. Sur un ordinateur portable ou de bureau, le curseur est contrôlé par votre souris ou votre pavé tactile.
      - generic [ref=f2e152]:
        - generic [ref=f2e153]: D
        - generic [ref=f2e154]:
          - generic [ref=f2e155]:
            - generic [ref=f2e156]: Hypertrucage (deepfake)
            - generic [ref=f2e157]: Sécurité
            - paragraph [ref=f2e158]: Une vidéo ou un enregistrement audio fabriqué avec l'IA qui fait croire que quelqu'un a dit ou fait une chose qu'il n'a jamais vraiment dite ou faite. Les fraudeurs utilisent les hypertrucages pour se faire passer pour des politiciens, des célébrités, ou même des membres de votre famille.
          - generic [ref=f2e159]:
            - generic [ref=f2e160]: Bureau
            - generic [ref=f2e161]: De base
            - paragraph [ref=f2e162]: Soit l'écran principal d'un ordinateur (l'arrière-plan où se trouvent les icônes), soit un type d'ordinateur qui reste sur une table plutôt que d'être portable. Sur un téléphone ou une tablette, l'équivalent est votre écran d'accueil.
          - generic [ref=f2e163]:
            - generic [ref=f2e164]: Téléchargement
            - generic [ref=f2e165]: De base
            - paragraph [ref=f2e166]: Copier quelque chose d'Internet vers votre appareil — comme enregistrer une photo, installer une appli ou recevoir une pièce jointe par courriel. Le contraire est le téléversement (envoyer quelque chose de votre appareil vers Internet).
          - generic [ref=f2e167]:
            - generic [ref=f2e168]: Fuite de données
            - generic [ref=f2e169]: Sécurité
            - paragraph [ref=f2e170]: Quand les renseignements privés d'une entreprise — y compris les noms, les mots de passe ou les numéros de carte de crédit de ses clients — sont volés par des pirates informatiques. Si vous apprenez qu'une entreprise que vous utilisez a subi une fuite de données, changez votre mot de passe pour ce service tout de suite.
          - generic [ref=f2e171]:
            - generic [ref=f2e172]: DNS
            - generic [ref=f2e173]: Intermédiaire
            - paragraph [ref=f2e174]: Signifie « Domain Name System » — l'annuaire téléphonique d'Internet. Quand vous tapez « google.com », le DNS traduit ce nom facile à retenir en un numéro que votre appareil utilise pour trouver le bon ordinateur. Vous n'avez presque jamais à y penser; ça fonctionne automatiquement en arrière-plan.
          - generic [ref=f2e175]:
            - generic [ref=f2e176]: Nom de domaine
            - generic [ref=f2e177]: Intermédiaire
            - paragraph [ref=f2e178]: L'adresse lisible d'un site Web — la partie après le « www. ». Par exemple, dans « www.rbc.com », le nom de domaine est « rbc.com ». Vérifiez toujours attentivement le nom de domaine avant d'entrer un mot de passe ou des renseignements bancaires, pour vous assurer qu'il s'agit du vrai site Web.
      - generic [ref=f2e179]:
        - generic [ref=f2e180]: E
        - generic [ref=f2e181]:
          - generic [ref=f2e182]:
            - generic [ref=f2e183]: Virement Interac
            - generic [ref=f2e184]: Service
            - paragraph [ref=f2e185]: Une façon d'envoyer de l'argent directement de votre compte bancaire à l'adresse courriel ou au numéro de téléphone d'une autre personne. C'est sécuritaire et instantané. Vous ne pouvez pas annuler un virement Interac une fois qu'il a été accepté par la personne qui le reçoit.
          - generic [ref=f2e186]:
            - generic [ref=f2e187]: Courriel
            - generic [ref=f2e188]: De base
            - paragraph [ref=f2e189]: Un message électronique envoyé sur Internet d'une personne à une autre. Comme une lettre, mais instantanée et gratuite. Il vous faut une adresse courriel (comme votrenom@gmail.com) pour envoyer et recevoir des courriels.
          - generic [ref=f2e190]:
            - generic [ref=f2e191]: Émoji
            - generic [ref=f2e192]: De base
            - paragraph [ref=f2e193]: De petits dessins utilisés dans les messages et les publications pour exprimer des émotions ou des idées — comme un sourire 😊, un cœur ❤️, ou un pouce levé 👍. Ils sont apparus comme une façon d'ajouter du ton à un texte, puisqu'un message écrit ne peut pas montrer une expression du visage.
          - generic [ref=f2e194]:
            - generic [ref=f2e195]: Chiffrement
            - generic [ref=f2e196]: Sécurité
            - paragraph [ref=f2e197]: Une façon de brouiller l'information pour que seul le destinataire prévu puisse la lire — comme envoyer une lettre dans une boîte verrouillée. Quand un site Web montre un cadenas dans la barre d'adresse, votre connexion est chiffrée, et personne ne peut lire ce que vous tapez.
      - generic [ref=f2e198]:
        - generic [ref=f2e199]: F
        - generic [ref=f2e200]:
          - generic [ref=f2e201]:
            - generic [ref=f2e202]: Facebook
            - generic [ref=f2e203]: Service
            - paragraph [ref=f2e204]: Un site Web et une appli de réseau social populaires où vous pouvez partager des nouvelles, des photos et des messages avec vos amis et votre famille. Vous créez un profil et vous vous connectez avec des gens que vous connaissez. Portez attention à vos paramètres de confidentialité — vous décidez qui peut voir ce que vous publiez.
          - generic [ref=f2e205]:
            - generic [ref=f2e206]: FaceTime
            - generic [ref=f2e207]: Service
            - paragraph [ref=f2e208]: L'appli d'appels vidéo gratuite d'Apple, intégrée à chaque iPhone et iPad. Vous pouvez voir et entendre la personne que vous appelez en temps réel — comme un téléphone vidéo. Elle fonctionne par Wi-Fi ou données mobiles, et les appels entre appareils Apple sont entièrement gratuits.
          - generic [ref=f2e209]:
            - generic [ref=f2e210]: Pare-feu
            - generic [ref=f2e211]: Sécurité
            - paragraph [ref=f2e212]: Une barrière de protection — intégrée à votre appareil ou à votre routeur — qui bloque le trafic Internet suspect à l'entrée. Voyez-le comme un agent de sécurité à la porte principale de votre appareil. La plupart des appareils viennent déjà avec un pare-feu activé.
          - generic [ref=f2e213]:
            - generic [ref=f2e214]: Dossier
            - generic [ref=f2e215]: De base
            - paragraph [ref=f2e216]: Un contenant utilisé pour organiser des fichiers ou des applis — tout comme un dossier physique dans un classeur. Sur votre iPad, vous pouvez regrouper des applis dans des dossiers en appuyant sur l'icône d'une appli jusqu'à ce qu'elle se mette à trembler, puis en la faisant glisser sur une autre.
          - generic [ref=f2e217]:
            - generic [ref=f2e218]: Micrologiciel
            - generic [ref=f2e219]: Intermédiaire
            - paragraph [ref=f2e220]: Le logiciel intégré à l'intérieur d'appareils comme les routeurs, les téléviseurs intelligents et les thermostats. Les mises à jour de micrologiciel corrigent des failles de sécurité et ajoutent de nouvelles fonctions. Votre routeur pourrait avoir besoin d'une mise à jour de micrologiciel de temps en temps.
          - generic [ref=f2e221]:
            - generic [ref=f2e222]: Police (de caractères)
            - generic [ref=f2e223]: De base
            - paragraph [ref=f2e224]: Le style et la forme des lettres imprimées ou affichées à l'écran. Tout comme une note manuscrite a l'air différente d'une lettre tapée, les différentes polices ont chacune leur personnalité — certaines sont formelles, d'autres décontractées. Vous pouvez souvent changer la taille de la police sur les sites Web et dans les paramètres de votre appareil.
      - generic [ref=f2e225]:
        - generic [ref=f2e226]: G
        - generic [ref=f2e227]:
          - generic [ref=f2e228]:
            - generic [ref=f2e229]: IA générative
            - generic [ref=f2e230]: Intermédiaire
            - paragraph [ref=f2e231]: Une IA capable de créer du nouveau contenu — textes, images, musique et vidéos — plutôt que de simplement répondre à des questions. ChatGPT, DALL-E et Gemini en sont des exemples.
          - generic [ref=f2e232]:
            - generic [ref=f2e233]: Gmail
            - generic [ref=f2e234]: Service
            - paragraph [ref=f2e235]: Le service de courriel gratuit de Google. Si votre adresse courriel se termine par « @gmail.com », vous utilisez Gmail. Vous pouvez y accéder par l'appli Gmail ou en visitant gmail.com dans votre navigateur. Il comprend 15 gigaoctets de stockage gratuit.
          - generic [ref=f2e236]:
            - generic [ref=f2e237]: Google
            - generic [ref=f2e238]: Service
            - paragraph [ref=f2e239]: Le moteur de recherche le plus populaire au monde — un outil qui vous aide à trouver de l'information sur Internet. Tapez simplement ce que vous cherchez, et Google vous montre une liste de sites Web correspondants. Google offre aussi beaucoup d'autres services, dont Gmail, Google Maps et YouTube.
          - generic [ref=f2e240]:
            - generic [ref=f2e241]: Google Maps
            - generic [ref=f2e242]: Service
            - paragraph [ref=f2e243]: Une appli gratuite qui vous montre des cartes, vous donne des directions étape par étape et vous aide à trouver des commerces, des restaurants et des services près de vous. Vous pouvez chercher une adresse, et l'appli vous y guidera à pied, en voiture ou en transport en commun — avec des instructions vocales.
      - generic [ref=f2e244]:
        - generic [ref=f2e245]: H
        - generic [ref=f2e246]:
          - generic [ref=f2e247]:
            - generic [ref=f2e248]: Hallucination (IA)
            - generic [ref=f2e249]: Intermédiaire
            - paragraph [ref=f2e250]: Quand un assistant d'IA vous donne, avec assurance, une information complètement inventée ou fausse. L'IA peut « halluciner » des faits, des noms et même des adresses Web. Vérifiez toujours une information importante auprès d'une autre source.
          - generic [ref=f2e251]:
            - generic [ref=f2e252]: Écran d'accueil
            - generic [ref=f2e253]: De base
            - paragraph [ref=f2e254]: L'écran principal que vous voyez en allumant votre téléphone ou votre tablette — celui où toutes les icônes de vos applis sont affichées. Peu importe à quel point vous vous sentez perdu dans une appli, appuyer sur le bouton d'accueil (ou glisser vers le haut depuis le bas de l'écran) vous y ramène toujours en toute sécurité.
          - generic [ref=f2e255]:
            - generic [ref=f2e256]: HTTPS
            - generic [ref=f2e257]: Sécurité
            - paragraph [ref=f2e258]: Le « s » de HTTPS veut dire « sécurisé ». Quand une adresse Web commence par « https:// » (et montre un cadenas), votre connexion est chiffrée — ce qui veut dire que personne ne peut espionner ce que vous tapez. Cherchez toujours https avant d'entrer un mot de passe ou un numéro de carte de crédit.
          - generic [ref=f2e259]:
            - generic [ref=f2e260]: HTML
            - generic [ref=f2e261]: Intermédiaire
            - paragraph [ref=f2e262]: Le langage de programmation utilisé pour construire la structure des pages Web — il indique à votre navigateur quels titres, paragraphes, images et liens afficher. Vous n'avez pas besoin de connaître le HTML pour utiliser Internet; il fonctionne silencieusement en arrière-plan de chaque site Web que vous visitez.
      - generic [ref=f2e263]:
        - generic [ref=f2e264]: I
        - generic [ref=f2e265]:
          - generic [ref=f2e266]:
            - generic [ref=f2e267]: Icône
            - generic [ref=f2e268]: De base
