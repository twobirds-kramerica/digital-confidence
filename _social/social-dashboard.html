<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Social Content Dashboard | Two Birds</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a1a1a; }
    .pin-wall { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
    .pin-form { background: #fff; border-radius: 12px; padding: 2rem; text-align: center; width: 320px; }
    .pin-form h1 { font-size: 1.1rem; margin-bottom: 1rem; }
    .pin-form input { width: 100%; padding: 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; text-align: center; letter-spacing: 0.3em; margin-bottom: 0.75rem; }
    .pin-form button { width: 100%; padding: 0.75rem; background: #1565C0; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; }
    .pin-error { color: #c62828; font-size: 0.85rem; margin-top: 0.5rem; }

    .dashboard { display: none; padding: 1.5rem; max-width: 1200px; margin: 0 auto; }
    .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 0.5rem; }
    .dash-title { font-size: 1.3rem; font-weight: 700; }
    .dash-meta { font-size: 0.82rem; color: #666; }
    .dash-controls { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .dash-controls select, .dash-controls input { padding: 0.45rem 0.75rem; border: 1px solid #ccc; border-radius: 8px; font-size: 0.85rem; }
    .btn { padding: 0.45rem 0.9rem; border: none; border-radius: 8px; font-size: 0.82rem; cursor: pointer; font-weight: 600; }
    .btn-blue { background: #1565C0; color: #fff; }
    .btn-green { background: #2e7d32; color: #fff; }
    .btn-outline { background: #fff; border: 1px solid #ccc; color: #333; }

    .stats-bar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .stat-chip { background: #fff; border: 1px solid #e0e0e0; border-radius: 10px; padding: 0.5rem 1rem; font-size: 0.82rem; }
    .stat-chip strong { display: block; font-size: 1.1rem; color: #1565C0; }

    .post-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
    .post-card { background: #fff; border: 1px solid #e0e0e0; border-radius: 12px; padding: 1rem; position: relative; }
    .post-card.status-posted { border-left: 4px solid #2e7d32; }
    .post-card.status-queued { border-left: 4px solid #1565C0; }
    .post-card.status-skip { border-left: 4px solid #999; opacity: 0.6; }

    .post-meta { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; flex-wrap: wrap; }
    .badge { font-size: 0.72rem; font-weight: 700; padding: 0.15rem 0.5rem; border-radius: 20px; text-transform: uppercase; }
    .badge-fb { background: #e3f2fd; color: #1565C0; }
    .badge-li { background: #e8f5e9; color: #2e7d32; }
    .badge-tip { background: #fff3e0; color: #e65100; }
    .badge-scam { background: #fce4ec; color: #c62828; }
    .badge-story { background: #f3e5f5; color: #7b1fa2; }
    .badge-module { background: #e8f5e9; color: #1b5e20; }
    .badge-community { background: #fff8e1; color: #f57f17; }
    .badge-partner { background: #e8eaf6; color: #283593; }
    .badge-data { background: #fbe9e7; color: #bf360c; }
    .badge-tl { background: #f1f8e9; color: #33691e; }
    .badge-bts { background: #ede7f6; color: #4527a0; }

    .post-copy { font-size: 0.85rem; line-height: 1.55; color: #333; white-space: pre-wrap; margin-bottom: 0.6rem; max-height: 120px; overflow: hidden; position: relative; }
    .post-copy.expanded { max-height: none; }
    .post-copy-fade { position: absolute; bottom: 0; left: 0; right: 0; height: 30px; background: linear-gradient(transparent, #fff); }
    .post-copy.expanded + .post-copy-fade { display: none; }

    .post-tags { font-size: 0.75rem; color: #1565C0; margin-bottom: 0.6rem; }
    .post-link { font-size: 0.75rem; color: #666; word-break: break-all; margin-bottom: 0.75rem; }
    .post-image { font-size: 0.75rem; color: #888; margin-bottom: 0.75rem; font-style: italic; }

    .post-actions { display: flex; gap: 0.4rem; flex-wrap: wrap; }
    .post-actions .btn { font-size: 0.75rem; padding: 0.3rem 0.65rem; }

    .copy-feedback { font-size: 0.72rem; color: #2e7d32; margin-left: 0.25rem; display: none; }

    @media (max-width: 600px) { .post-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>

<!-- PIN Gate -->
<div class="pin-wall" id="pinWall">
  <div class="pin-form">
    <h1>🐦 Social Dashboard</h1>
    <p style="font-size:0.85rem;color:#666;margin-bottom:1rem">Two Birds Innovation — Internal use only</p>
    <input type="password" id="pinInput" placeholder="PIN" maxlength="4" autocomplete="off">
    <button onclick="checkPin()">Enter</button>
    <div class="pin-error" id="pinError"></div>
  </div>
</div>

<!-- Dashboard -->
<div class="dashboard" id="dashboardArea">
  <div class="dash-header">
    <div>
      <div class="dash-title">Social Content Dashboard</div>
      <div class="dash-meta">Two Birds Innovation · Digital Confidence Centre · 40 posts ready</div>
    </div>
    <div class="dash-controls">
      <select id="filterPlatform" onchange="renderPosts()">
        <option value="all">All platforms</option>
        <option value="facebook">Facebook only</option>
        <option value="linkedin">LinkedIn only</option>
      </select>
      <select id="filterStatus" onchange="renderPosts()">
        <option value="all">All statuses</option>
        <option value="queued">Queued</option>
        <option value="posted">Posted</option>
        <option value="skip">Skip</option>
      </select>
      <input type="text" id="filterSearch" placeholder="Search..." oninput="renderPosts()" style="width:140px">
      <button class="btn btn-green" onclick="exportCSV()">Export CSV</button>
    </div>
  </div>

  <div class="stats-bar" id="statsBar"></div>
  <div class="post-grid" id="postGrid"></div>
</div>

<script>
const PIN = '2026';
let posts = [];

function checkPin() {
  const val = document.getElementById('pinInput').value;
  if (val === PIN) {
    document.getElementById('pinWall').style.display = 'none';
    document.getElementById('dashboardArea').style.display = 'block';
    loadData();
  } else {
    document.getElementById('pinError').textContent = 'Incorrect PIN. Try again.';
  }
}
document.getElementById('pinInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') checkPin();
});

function loadData() {
  fetch('content-queue.json')
    .then(r => r.json())
    .then(data => {
      posts = data.posts;
      // Restore statuses from localStorage
      posts.forEach(function(p) {
        const saved = localStorage.getItem('dcc-social-' + p.id);
        if (saved) p.status = saved;
      });
      renderStats();
      renderPosts();
    })
    .catch(function() {
      document.getElementById('postGrid').innerHTML = '<p style="color:#c62828;padding:1rem">Could not load content-queue.json. Make sure you are serving from the _social/ directory.</p>';
    });
}

function renderStats() {
  const total = posts.length;
  const queued = posts.filter(p => p.status === 'queued').length;
  const posted = posts.filter(p => p.status === 'posted').length;
  const fb = posts.filter(p => p.platform === 'facebook').length;
  const li = posts.filter(p => p.platform === 'linkedin').length;
  document.getElementById('statsBar').innerHTML =
    chip('Total Posts', total) +
    chip('Queued', queued, '#1565C0') +
    chip('Posted', posted, '#2e7d32') +
    chip('Facebook', fb) +
    chip('LinkedIn', li);
}

function chip(label, val, color) {
  return '<div class="stat-chip"><strong style="color:' + (color||'#1565C0') + '">' + val + '</strong>' + label + '</div>';
}

const pillarBadge = {
  quick_tip: ['badge-tip', 'Quick Tip'],
  scam_warning: ['badge-scam', 'Scam Warning'],
  story: ['badge-story', 'Story'],
  module_spotlight: ['badge-module', 'Module Spotlight'],
  community: ['badge-community', 'Community'],
  thought_leadership: ['badge-tl', 'Thought Leadership'],
  product_update: ['badge-module', 'Product Update'],
  partnership: ['badge-partner', 'Partnership'],
  data_stat: ['badge-data', 'Data & Stats'],
  behind_scenes: ['badge-bts', 'Behind the Scenes'],
};

function renderPosts() {
  const platform = document.getElementById('filterPlatform').value;
  const status = document.getElementById('filterStatus').value;
  const search = document.getElementById('filterSearch').value.toLowerCase();

  const filtered = posts.filter(function(p) {
    if (platform !== 'all' && p.platform !== platform) return false;
    if (status !== 'all' && p.status !== status) return false;
    if (search && !p.copy.toLowerCase().includes(search) && !p.topic.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('postGrid').innerHTML = filtered.map(function(p) {
    const [badgeClass, badgeLabel] = pillarBadge[p.pillar] || ['badge-tip', p.pillar];
    const platformBadge = p.platform === 'facebook' ? 'badge-fb' : 'badge-li';
    const platformLabel = p.platform === 'facebook' ? '📘 Facebook' : '💼 LinkedIn';
    return '<div class="post-card status-' + p.status + '" id="card-' + p.id + '">' +
      '<div class="post-meta">' +
        '<span class="badge ' + platformBadge + '">' + platformLabel + '</span>' +
        '<span class="badge ' + badgeClass + '">' + badgeLabel + '</span>' +
        '<span class="badge" style="background:#f5f5f5;color:#666">' + p.id + '</span>' +
      '</div>' +
      '<div class="post-copy" id="copy-' + p.id + '">' + escHtml(p.copy) + '<div class="post-copy-fade"></div></div>' +
      '<div class="post-tags">' + escHtml(p.hashtags) + '</div>' +
      '<div class="post-image">📷 ' + escHtml(p.image_suggestion) + '</div>' +
      '<div class="post-link">🔗 ' + escHtml(p.link) + '</div>' +
      '<div class="post-actions">' +
        '<button class="btn btn-blue" onclick="copyPost(\'' + p.id + '\')">Copy</button>' +
        '<span class="copy-feedback" id="cf-' + p.id + '">Copied!</span>' +
        '<button class="btn btn-outline" onclick="toggleExpand(\'' + p.id + '\')">Expand</button>' +
        '<button class="btn btn-green" onclick="setStatus(\'' + p.id + '\',\'posted\')" ' + (p.status==='posted'?'disabled style="opacity:0.5"':'') + '>✓ Posted</button>' +
        '<button class="btn btn-outline" onclick="setStatus(\'' + p.id + '\',\'skip\')">Skip</button>' +
        '<button class="btn btn-outline" onclick="setStatus(\'' + p.id + '\',\'queued\')">Reset</button>' +
      '</div>' +
    '</div>';
  }).join('');
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function copyPost(id) {
  const p = posts.find(function(x){return x.id===id;});
  if (!p) return;
  const text = p.copy + '\n\n' + p.hashtags + '\n\n' + p.link;
  navigator.clipboard.writeText(text).then(function() {
    const el = document.getElementById('cf-' + id);
    el.style.display = 'inline';
    setTimeout(function(){el.style.display='none';}, 2000);
  });
}

function toggleExpand(id) {
  const el = document.getElementById('copy-' + id);
  el.classList.toggle('expanded');
}

function setStatus(id, status) {
  const p = posts.find(function(x){return x.id===id;});
  if (p) {
    p.status = status;
    localStorage.setItem('dcc-social-' + id, status);
    renderStats();
    renderPosts();
  }
}

function exportCSV() {
  const headers = ['id','platform','pillar','topic','status','copy','hashtags','link','image_suggestion'];
  const rows = posts.map(function(p) {
    return headers.map(function(h) {
      return '"' + String(p[h]||'').replace(/"/g,'""') + '"';
    }).join(',');
  });
  const csv = headers.join(',') + '\n' + rows.join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'social-content-queue-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}
</script>
</body>
</html>
