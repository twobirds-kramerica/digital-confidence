          - generic [ref=e209]: High
        - paragraph [ref=e210]: AI Voice Clone — The Grandparent Scam Gets Smarter
        - paragraph [ref=e211]: Scammers are now using artificial intelligence to clone the voices of grandchildren and call seniors pretending to be in trouble — injured in an accident, arrested, or stranded abroad — and urgently needing money.
        - strong [ref=e212]: "What to do:"
        - list [ref=e213]:
          - listitem [ref=e214]: Hang up and call your grandchild directly on their usual number
          - listitem [ref=e215]: Establish a family code word to verify genuine emergencies
          - listitem [ref=e216]: Never send money by e-transfer, gift cards, or crypto to someone you have not spoken to in person
          - listitem [ref=e217]: "Report to the Canadian Anti-Fraud Centre: 1-888-495-8501"
