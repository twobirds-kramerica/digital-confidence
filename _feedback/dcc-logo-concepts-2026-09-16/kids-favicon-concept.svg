<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" aria-label="DCC Kids Favicon Concept">
  <!-- DCC Kids Favicon Concept (32x32) - Revision 002 -->
  <!-- Background: DCC Teal (#2A7B6F) with 6px rounded corners -->
  <rect width="32" height="32" rx="6" fill="#2A7B6F"/>

  <!-- Kid Cue 1: Stylized Sideways Baseball Cap (#E8842C Burnt Orange) - Bulb removed per Round 2 simplification -->
  <!-- Cap Crown -->
  <path d="M8 12.5 C8 7 12.5 5.5 17 5.5 C21.5 5.5 24 7.5 24 12.5 Z" fill="#E8842C"/>
  <!-- Cap Visor / Brim sticking out to the right -->
  <path d="M22 12.5 C25 12.5 29 13.5 30 15 C27 15 22.5 14 20.5 13.6 Z" fill="#E8842C"/>
  <!-- Small Button on Cap top -->
  <circle cx="16.5" cy="5.5" r="1.1" fill="#FAFAF8"/>

  <!-- Kid Cue 2: Friendly, Serious-Calm Eye Dots & Warm Smile (#FAFAF8 Off-White) -->
  <circle cx="12" cy="18" r="1.8" fill="#FAFAF8"/>
  <circle cx="20" cy="18" r="1.8" fill="#FAFAF8"/>
  <!-- Warm Smile Arc -->
  <path d="M13.5 22 Q16 24 18.5 22" fill="none" stroke="#FAFAF8" stroke-width="1.5" stroke-linecap="round"/>
</svg>
