<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" aria-label="DCC Adults Favicon Concept">
  <!-- DCC Adults Favicon Concept (32x32) -->
  <!-- Background: DCC Trust Blue (#1D4E89) with 6px rounded corners -->
  <rect width="32" height="32" rx="6" fill="#1D4E89"/>

  <!-- Light Bulb Contour (DCC Core Mark Family Shape) -->
  <path d="M16 4 C21.5 4 25 8.5 25 13.5 C25 17.5 22 19.5 21 21.5 L20 23.5 L12 23.5 L11 21.5 C10 19.5 7 17.5 7 13.5 C7 8.5 10.5 4 16 4Z" 
        fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  
  <!-- Bulb Base Lines -->
  <line x1="12.5" y1="25.5" x2="19.5" y2="25.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="13.5" y1="27.5" x2="18.5" y2="27.5" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Adult Cue: Spectacles / Reading Glasses Motif (#E0A63A Warm Amber) -->
  <!-- Left Lens -->
  <circle cx="12" cy="13.5" r="3" fill="none" stroke="#E0A63A" stroke-width="1.6"/>
  <!-- Right Lens -->
  <circle cx="20" cy="13.5" r="3" fill="none" stroke="#E0A63A" stroke-width="1.6"/>
  <!-- Bridge -->
  <path d="M15 13 C15.5 12 16.5 12 17 13" fill="none" stroke="#E0A63A" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Temples/Sides -->
  <line x1="9" y1="13" x2="7.5" y2="12.5" stroke="#E0A63A" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="23" y1="13" x2="24.5" y2="12.5" stroke="#E0A63A" stroke-width="1.2" stroke-linecap="round"/>
</svg>
