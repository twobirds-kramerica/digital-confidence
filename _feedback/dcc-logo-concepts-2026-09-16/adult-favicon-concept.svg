<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" aria-label="DCC Adults Favicon Concept">
  <!-- DCC Adults Favicon Concept (32x32) - Revision 002 -->
  <!-- Background: DCC Trust Blue (#1D4E89) with 6px rounded corners -->
  <rect width="32" height="32" rx="6" fill="#1D4E89"/>

  <!-- Spectacles / Reading Glasses Motif (#E0A63A Warm Amber) - Bulb removed per Round 2 simplification -->
  <!-- Left Lens (Radius 4.0, Stroke 1.0) -->
  <circle cx="11.5" cy="13.5" r="4" fill="none" stroke="#E0A63A" stroke-width="1.0"/>
  <!-- Right Lens (Radius 4.0, Stroke 1.0) -->
  <circle cx="20.5" cy="13.5" r="4" fill="none" stroke="#E0A63A" stroke-width="1.0"/>
  <!-- Bridge -->
  <path d="M15.5 12.8 C15.8 11.8 16.2 11.8 16.5 12.8" fill="none" stroke="#E0A63A" stroke-width="0.9" stroke-linecap="round"/>
  <!-- Temples/Sides -->
  <line x1="7.5" y1="12.8" x2="5.5" y2="12.1" stroke="#E0A63A" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="24.5" y1="12.8" x2="26.5" y2="12.1" stroke="#E0A63A" stroke-width="0.8" stroke-linecap="round"/>

  <!-- Facial Expression: Subtle Calm Smile (#FAFAF8) -->
  <path d="M14 20.5 Q16 22 18 20.5" fill="none" stroke="#FAFAF8" stroke-width="1.0" stroke-linecap="round"/>
</svg>
