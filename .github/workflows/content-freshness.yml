name: Monthly Content Freshness Review

on:
  schedule:
    - cron: '0 9 1 * *'  # 9 AM UTC on the 1st of every month
  workflow_dispatch:       # Allow manual trigger

jobs:
  content-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check content dates and create review issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Read content-dates.json
            const dataPath = path.join(process.env.GITHUB_WORKSPACE, '_data/content-dates.json');
            if (!fs.existsSync(dataPath)) {
              console.log('content-dates.json not found — skipping');
              return;
            }

            const data = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
            const now = new Date();
            const monthYear = now.toLocaleString('en-CA', { month: 'long', year: 'numeric' });

            // Find sections older than 60 days
            const stale = [];
            for (const [moduleId, module] of Object.entries(data.modules || {})) {
              for (const [sectionId, section] of Object.entries(module.sections || {})) {
                const verifiedDate = new Date(section.verified);
                const daysSince = Math.floor((now - verifiedDate) / (1000 * 60 * 60 * 24));
                if (daysSince > 60) {
                  stale.push({
                    module: moduleId,
                    moduleTitle: module.title,
                    section: sectionId,
                    label: section.label,
                    daysSince,
                    sensitivity: section.sensitivity || 'medium'
                  });
                }
              }
            }

            // Build issue body
            let body = `## Monthly Content Review — ${monthYear}\n\n`;
            body += `**Auto-generated by GitHub Actions on ${now.toISOString().split('T')[0]}**\n\n`;

            if (stale.length === 0) {
              body += '✅ All content sections were verified within the last 60 days. No action required.\n\n';
            } else {
              body += `⚠️ **${stale.length} section(s) require review** (last verified more than 60 days ago):\n\n`;
              body += '| Module | Section | Days Since Verification | Sensitivity |\n';
              body += '|--------|---------|------------------------|-------------|\n';
              stale.sort((a, b) => b.daysSince - a.daysSince).forEach(s => {
                body += `| ${s.moduleTitle} | ${s.label} | ${s.daysSince} days | ${s.sensitivity} |\n`;
              });
              body += '\n### How to update\n';
              body += '1. Review each flagged section for accuracy\n';
              body += '2. Update the `verified` date in `_data/content-dates.json`\n';
              body += '3. Commit with message: `chore: content freshness review [Month Year]`\n';
            }

            body += '\n---\n*Assigned to @twobirds-kramerica. Close this issue when review is complete.*';

            // Create the issue
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Monthly Content Review — ${monthYear}`,
              body: body,
              labels: ['content-review', 'maintenance'],
              assignees: ['twobirds-kramerica']
            });

            console.log(`Created content review issue for ${monthYear}`);
