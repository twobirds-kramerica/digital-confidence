name: Monthly Content Freshness Review

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

jobs:
  content-review:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check content, external URLs, and module EEAT completeness
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const https = require('https');
            const now = new Date();
            const monthYear = now.toLocaleString('en-CA', { month: 'long', year: 'numeric' });
            const workspace = process.env.GITHUB_WORKSPACE;

            // 1. Content-dates freshness (90-day threshold)
            const dataPath = path.join(workspace, '_data/content-dates.json');
            let stale = [];
            if (fs.existsSync(dataPath)) {
              const data = JSON.parse(fs.readFileSync(dataPath, 'utf8'));
              for (const [mId, mod] of Object.entries(data.modules || {})) {
                for (const [sId, sec] of Object.entries(mod.sections || {})) {
                  const days = Math.floor((now - new Date(sec.verified)) / 86400000);
                  if (days > 90) stale.push({ title: mod.title, label: sec.label, days, sensitivity: sec.sensitivity || 'medium' });
                }
              }
            }

            // 2. External URL check from sources-block
            function checkUrl(url) {
              return new Promise(resolve => {
                try {
                  const u = new URL(url);
                  const req = https.request({ hostname: u.hostname, path: u.pathname + u.search, method: 'HEAD', timeout: 5000, headers: { 'User-Agent': 'DCC-ContentFreshness/1.0' } }, res => {
                    resolve({ url, status: res.statusCode });
                  });
                  req.on('error', () => resolve({ url, status: 'ERROR' }));
                  req.on('timeout', () => { req.destroy(); resolve({ url, status: 'TIMEOUT' }); });
                  req.end();
                } catch(e) { resolve({ url, status: 'INVALID' }); }
              });
            }

            const urlSet = new Set();
            const allFiles = [];
            for (const dir of ['.', 'geo-content', 'resources', 'tips', 'resources/scam-deep-dives']) {
              const dirPath = path.join(workspace, dir);
              if (fs.existsSync(dirPath)) {
                fs.readdirSync(dirPath).filter(f => f.endsWith('.html')).forEach(f => allFiles.push(path.join(dir, f)));
              }
            }
            for (const f of allFiles) {
              const c = fs.readFileSync(path.join(workspace, f), 'utf8');
              const matches = c.matchAll(/class="sources-block"[\s\S]{0,2000}?href="(https?:\/\/[^"]+)"/g);
              for (const m of matches) urlSet.add(m[1]);
            }
            const urlArray = Array.from(urlSet).slice(0, 30);
            const urlResults = await Promise.all(urlArray.map(checkUrl));
            const brokenUrls = urlResults.filter(r => [404, 'ERROR', 'TIMEOUT', 'INVALID'].includes(r.status));

            // 3. Module EEAT completeness
            const mFiles = ['module-1','module-2','module-3','module-4','module-5','module-6','module-7','module-8','module-9','module-10','module-11','module-12','module-16-travel-safety','module-17-ai-research','module-visual-ai'];
            const modSummary = [];
            for (const f of mFiles) {
              const fp = path.join(workspace, f + '.html');
              if (!fs.existsSync(fp)) continue;
              const c = fs.readFileSync(fp, 'utf8');
              const t = (c.match(/<h1[^>]*>([^<]+)<\/h1>/) || ['',''])[1].substring(0, 40);
              modSummary.push({ t, byline: c.includes('module-byline'), accordion: c.includes('quick-answers-accordion'), sources: c.includes('sources-block') });
            }

            // 4. Build issue
            let body = `## Monthly Content Review — ${monthYear}\n**Auto-generated ${now.toISOString().split('T')[0]}**\n\n`;
            body += `### Content Freshness (90-day)\n${stale.length === 0 ? '✅ All content current.\n' : `⚠️ ${stale.length} section(s) need review:\n\n| Module | Section | Days | Sensitivity |\n|---|---|---|---|\n` + stale.map(s => `| ${s.title} | ${s.label} | ${s.days} | ${s.sensitivity} |`).join('\n') + '\n'}\n`;
            body += `### External URL Check (${urlArray.length} checked)\n${brokenUrls.length === 0 ? '✅ All URLs OK.\n' : `⚠️ ${brokenUrls.length} broken:\n` + brokenUrls.map(r => `- \`${r.status}\` ${r.url}`).join('\n') + '\n'}\n`;
            body += `### Module EEAT Completeness\n| Module | Byline | Accordion | Sources |\n|---|---|---|---|\n`;
            modSummary.forEach(m => { body += `| ${m.t} | ${m.byline?'✅':'❌'} | ${m.accordion?'✅':'❌'} | ${m.sources?'✅':'❌'} |\n`; });
            body += '\n---\n*Close when review complete. Update `_data/content-dates.json` as needed.*';

            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Monthly Content Review — ${monthYear}`,
              body, labels: ['content-review', 'maintenance'], assignees: ['twobirds-kramerica']
            });
