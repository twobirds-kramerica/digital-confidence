name: External Link Checker

on:
  schedule:
    # Every Sunday at 6:00 AM EST (11:00 UTC)
    - cron: '0 11 * * 0'
  workflow_dispatch:

jobs:
  check-links:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check critical external links
        id: linkcheck
        run: |
          BROKEN=""
          OK=""

          check_link() {
            local url="$1"
            local label="$2"
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --user-agent "Mozilla/5.0 DCC-LinkChecker/1.0" "$url" || echo "ERROR")
            if [[ "$STATUS" == "200" || "$STATUS" == "301" || "$STATUS" == "302" ]]; then
              OK="${OK}- ✅ ${label}: ${url} (${STATUS})\n"
            else
              BROKEN="${BROKEN}- ❌ ${label}: ${url} (${STATUS})\n"
            fi
          }

          # Government and helpline pages
          check_link "https://www.antifraudcentre.ca" "Canadian Anti-Fraud Centre"
          check_link "https://www.canada.ca/en/revenue-agency.html" "CRA"
          check_link "https://www.priv.gc.ca/en/" "Privacy Commissioner of Canada"
          check_link "https://www.osc.ca" "Ontario Securities Commission"
          check_link "https://211ontario.ca" "211 Ontario"
          check_link "https://www.canada.ca/en/employment-social-development/corporate/contact/sin.html" "SIN information"

          # Ontario programs
          check_link "https://www.ontario.ca/page/get-help-paying-for-drugs" "Ontario Drug Benefit"
          check_link "https://www.ontario.ca/page/seniors-care-at-home-tax-credit" "Seniors Care at Home Tax Credit"

          # Key digital platforms used in DCC modules
          check_link "https://support.apple.com" "Apple Support"
          check_link "https://formspree.io/f/xeerqryj" "Formspree endpoint"

          # CASC and reporting
          check_link "https://www.fightspam.gc.ca" "CASL Reporting (fightspam.gc.ca)"
          check_link "https://www.ccts-cprst.ca" "CCTS telecom complaints"

          DELIM="ghadelim_$(openssl rand -hex 8)"

          echo "broken_links<<$DELIM" >> $GITHUB_OUTPUT
          printf '%s' "$BROKEN" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

          echo "ok_links<<$DELIM" >> $GITHUB_OUTPUT
          printf '%s' "$OK" >> $GITHUB_OUTPUT
          echo "$DELIM" >> $GITHUB_OUTPUT

          # Count broken links for issue creation decision
          BROKEN_COUNT=$(printf "$BROKEN" | grep -c "❌" || echo "0")
          echo "broken_count=$BROKEN_COUNT" >> $GITHUB_OUTPUT

      - name: Create issue if broken links found
        if: steps.linkcheck.outputs.broken_count != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const brokenLinks = `${{ steps.linkcheck.outputs.broken_links }}`;
            const okLinks = `${{ steps.linkcheck.outputs.ok_links }}`;
            const brokenCount = '${{ steps.linkcheck.outputs.broken_count }}';

            const body = [
              `# 🔗 External Link Check — ${today}`,
              '',
              `## ⚠️ Broken or Unreachable Links (${brokenCount} found)`,
              brokenLinks,
              '',
              '## ✅ Links Working',
              okLinks,
              '',
              '## Action Required',
              'For each broken link:',
              '1. Visit the URL to confirm it is actually broken (not a false positive from rate limiting)',
              '2. Find the replacement URL or alternative resource',
              '3. Search the codebase for the broken URL: `grep -r "broken-url.com" .`',
              '4. Update all occurrences and commit',
              '',
              '## Priority Links to Fix First',
              '- Formspree endpoint (feedback form will fail if this is broken)',
              '- CAFC link (most-referenced safety resource)',
              '- CRA link (referenced in scam content)',
              '',
              '---',
              '*Generated by GitHub Actions — External Link Checker (weekly, Sundays)*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🔗 Broken Links Found — ${today}`,
              body: body,
              labels: ['broken-links', 'maintenance']
            });

      - name: Log results if all links ok
        if: steps.linkcheck.outputs.broken_count == '0'
        run: |
          echo "✅ All external links are working."
          echo "No issue created."
