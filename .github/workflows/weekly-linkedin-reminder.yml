name: Weekly LinkedIn Reminder

on:
  schedule:
    # Every Monday at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 * * 1'
  workflow_dispatch:

jobs:
  linkedin-reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get week's activity
        id: activity
        run: |
          COMMITS=$(git log --oneline --since="7 days ago" --format="- %s" | head -10)
          echo "weekly_commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create LinkedIn reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('en-CA', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            const weekActivity = `${{ steps.activity.outputs.weekly_commits }}`;

            const postIdeas = [
              "Share a tip from Module 2 (Scam Protection) — these get strong engagement from seniors and their families",
              "Post about a real scam that's circulating in Ontario — reference CAFC data if available",
              "Highlight the bilingual nature of DCC — this differentiates from most Canadian digital literacy tools",
              "Share the Brenda persona story — why DCC was built and who it's for",
              "Post about a specific module milestone (e.g. 19 modules now live)",
              "Thought leadership: Why public libraries are the ideal digital literacy delivery partner",
              "Share a stat about senior digital isolation or fraud — position DCC as the response",
              "Behind the scenes: what it takes to build an accessible digital literacy platform solo"
            ];

            // Pick a suggestion based on week number (rotate through list)
            const weekNum = Math.floor(Date.now() / (7 * 24 * 60 * 60 * 1000));
            const suggestion = postIdeas[weekNum % postIdeas.length];

            const body = `# LinkedIn Reminder — ${today}

## This Week's Build Activity
${weekActivity || 'No commits this week — consider sharing a platform update or thought leadership piece.'}

## Suggested Post Angle
> ${suggestion}

## Quick Post Templates

### Option A — Short (good for Monday morning)
\`\`\`
[Stat or hook about senior digital literacy in Canada]

The Digital Confidence Centre is a free, bilingual platform built to help. 19 modules. WCAG 2.1 AA accessible. No registration required.

If you work with seniors — libraries, credit unions, community orgs — it's worth a look.

[DCC URL]

#DigitalLiteracy #SeniorsCanada #Accessibility #Ontario
\`\`\`

### Option B — Story format
\`\`\`
Meet Brenda.

She's 74, lives alone in St. Thomas, and has an iPad she mostly uses for solitaire.

She's afraid of clicking the wrong thing. She's missed video calls with her grandchildren because she didn't know how to answer them.

The Digital Confidence Centre was built for Brenda. Every module starts from zero. Every instruction is in plain language.

Module 18 — Staying Connected — might be the thing that finally gets her talking to her grandchildren.

It's free. It's bilingual. It works on any device.

[DCC URL]
\`\`\`

## Posting Checklist
- [ ] Draft post (use one of the templates above as a starting point)
- [ ] Add 1–2 relevant hashtags
- [ ] Tag any relevant organisations if applicable
- [ ] Post between 7–9 AM or 12–2 PM for best reach
- [ ] Respond to any comments from last week's post

---
*Generated by GitHub Actions — Weekly LinkedIn Reminder workflow*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📣 LinkedIn Reminder — Week of ${today}`,
              body: body,
              labels: ['linkedin', 'marketing']
            });
