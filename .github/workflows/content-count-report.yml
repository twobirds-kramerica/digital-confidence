name: Content Count Report

on:
  push:
    branches: [main]

jobs:
  count:
    name: Count content files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Count current files
        id: current
        run: |
          HTML=$(find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" | wc -l)
          JS=$(find . -name "*.js" -not -path "./.git/*" -not -path "./node_modules/*" | wc -l)
          CSS=$(find . -name "*.css" -not -path "./.git/*" -not -path "./node_modules/*" | wc -l)
          SITEMAP=$(grep -c '<loc>' sitemap.xml 2>/dev/null || echo 0)
          echo "html=$HTML" >> $GITHUB_OUTPUT
          echo "js=$JS" >> $GITHUB_OUTPUT
          echo "css=$CSS" >> $GITHUB_OUTPUT
          echo "sitemap=$SITEMAP" >> $GITHUB_OUTPUT
          echo "HTML files: $HTML"
          echo "JS files: $JS"
          echo "CSS files: $CSS"
          echo "Sitemap URLs: $SITEMAP"

      - name: Count previous files
        id: previous
        run: |
          git stash 2>/dev/null || true
          PREV_HTML=$(git show HEAD~1:. 2>/dev/null | grep -c '\.html' || echo 0)
          CURR_HTML=${{ steps.current.outputs.html }}
          echo "prev_html=$PREV_HTML" >> $GITHUB_OUTPUT

      - name: Post content summary
        uses: actions/github-script@v7
        with:
          script: |
            const html = '${{ steps.current.outputs.html }}';
            const js = '${{ steps.current.outputs.js }}';
            const css = '${{ steps.current.outputs.css }}';
            const sitemap = '${{ steps.current.outputs.sitemap }}';

            const summary = [
              '## 📊 Content Count Report',
              '',
              '| File Type | Count |',
              '|-----------|-------|',
              '| HTML pages | ' + html + ' |',
              '| JavaScript files | ' + js + ' |',
              '| CSS files | ' + css + ' |',
              '| Sitemap URLs | ' + sitemap + ' |',
              '',
              '_Generated on push to main — ' + new Date().toLocaleDateString('en-CA') + '_'
            ].join('\n');

            core.summary.addRaw(summary).write();
            console.log('Content count posted to step summary.');
