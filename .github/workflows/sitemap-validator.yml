name: Sitemap Validator

on:
  workflow_dispatch:

jobs:
  validate-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get install -y libxml2-utils

      - name: Validate sitemap.xml
        id: validate
        run: |
          ERRORS=""
          WARNINGS=""

          # Check sitemap.xml exists
          if [ ! -f "sitemap.xml" ]; then
            ERRORS="${ERRORS}- sitemap.xml file is missing\n"
          else
            # Check it is valid XML
            if ! xmllint --noout sitemap.xml 2>/dev/null; then
              ERRORS="${ERRORS}- sitemap.xml is not valid XML\n"
            else
              # Count URLs
              URL_COUNT=$(grep -c "<loc>" sitemap.xml || echo "0")
              echo "url_count=$URL_COUNT" >> $GITHUB_OUTPUT
              echo "Sitemap URL count: $URL_COUNT"

              # Check for duplicate URLs
              DUPES=$(grep "<loc>" sitemap.xml | sort | uniq -d | wc -l)
              if [ "$DUPES" -gt "0" ]; then
                WARNINGS="${WARNINGS}- ${DUPES} duplicate URL(s) found in sitemap.xml\n"
              fi
            fi
          fi

          # Check sitemap-news.xml exists and is valid
          if [ ! -f "sitemap-news.xml" ]; then
            WARNINGS="${WARNINGS}- sitemap-news.xml is missing\n"
          else
            if ! xmllint --noout sitemap-news.xml 2>/dev/null; then
              ERRORS="${ERRORS}- sitemap-news.xml is not valid XML\n"
            fi
          fi

          # Check robots.txt references sitemaps
          if [ -f "robots.txt" ]; then
            if ! grep -q "sitemap.xml" robots.txt; then
              WARNINGS="${WARNINGS}- robots.txt does not reference sitemap.xml\n"
            fi
            if ! grep -q "sitemap-news.xml" robots.txt; then
              WARNINGS="${WARNINGS}- robots.txt does not reference sitemap-news.xml\n"
            fi
          fi

          ERROR_COUNT=$(printf "$ERRORS" | grep -c "missing\|not valid" || echo "0")

          if [ "$ERROR_COUNT" -gt "0" ]; then
            echo "Errors found:"
            printf "$ERRORS"
            exit 1
          fi

          echo "Sitemap validation passed."
          if [ -n "$WARNINGS" ]; then
            echo "Warnings:"
            printf "$WARNINGS"
          fi
