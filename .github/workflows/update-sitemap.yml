name: Update Sitemap Dates

on:
  workflow_dispatch:

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Update sitemap lastmod dates
        run: |
          TODAY=$(date +%Y-%m-%d)

          # Get list of HTML files changed in the last commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null | grep '\.html$' || true)

          if [ -z "$CHANGED" ]; then
            echo "No HTML files changed in last commit. Skipping sitemap update."
            exit 0
          fi

          echo "Changed HTML files:"
          echo "$CHANGED"

          for FILE in $CHANGED; do
            BASENAME=$(basename "$FILE")
            if grep -q "$BASENAME" sitemap.xml; then
              echo "Updating lastmod for: $BASENAME"
              python3 -c "import re; content=open('sitemap.xml').read(); content=re.sub(r'(<loc>[^<]*${BASENAME}</loc>\s*<lastmod>)[^<]*(</lastmod>)', r'\g<1>${TODAY}\g<2>', content); open('sitemap.xml','w').write(content)"
            fi
          done

          echo "Sitemap updated with date: ${TODAY}"

      - name: Check if sitemap changed
        id: sitemap-diff
        run: |
          if git diff --quiet sitemap.xml; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No sitemap changes detected."
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Sitemap changes detected."
          fi

      - name: Commit updated sitemap
        if: steps.sitemap-diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: update sitemap lastmod dates [skip ci]"
          git push
