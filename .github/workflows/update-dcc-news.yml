name: Update DCC News Feed

on:
  schedule:
    # Daily at 06:00 UTC (02:00 EDT) — fresh before Canadian morning
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch CBC Technology RSS
        run: python scripts/fetch-dcc-news.py

      - name: Commit updated news feed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/news-feed.json
          if git diff --staged --quiet; then
            echo "No changes to news feed."
          else
            git commit -m "chore(data): update DCC news feed [skip ci]"
            git push
          fi
