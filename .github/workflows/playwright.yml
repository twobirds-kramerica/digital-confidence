name: Viewport + cross-engine smoke (Playwright)

# Playwright CI: catches layout regressions (Chromium × 3 viewports) and
# engine-specific regressions (Firefox + WebKit at desktop-1280).
#
# S-029 shipped the Chromium viewport portion. This revision (item #8 on
# the Notion backlog) adds Firefox + WebKit cross-engine coverage.
#
# Test matrix:
#   Chromium: 6 pages × 3 viewports = 18 tests (layout / overflow / blank-page)
#   Firefox:  6 pages × 1 viewport  = 6 tests  (engine diffs)
#   WebKit:   6 pages × 1 viewport  = 6 tests  (Safari engine diffs)
#   Total: 30 tests per run.
#
# Deferred to a separate follow-up: visual regression baselines + diff
# thresholds (filed as own Notion item).
#
# Fails the build on any regression; uploads screenshots + trace + HTML report
# as a single artifact for post-mortem.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - 'tests/playwright/**'
      - '.github/workflows/playwright.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: Playwright smoke (Chromium × 3 + Firefox + WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install http-server
        run: npm install -g http-server@14.1.1

      - name: Install Playwright + test harness
        working-directory: tests/playwright
        run: |
          npm install --no-audit --no-fund

      - name: Install Chromium + Firefox + WebKit for Playwright
        working-directory: tests/playwright
        run: |
          npx playwright install --with-deps chromium firefox webkit

      - name: Serve DCC site on :3000
        run: |
          http-server . -p 3000 -s --cors &
          echo $! > /tmp/http-server.pid
          # Wait for server to answer
          for i in 1 2 3 4 5 6 7 8; do
            if curl -sSf http://localhost:3000/ > /dev/null; then
              echo "Server up."
              break
            fi
            sleep 1
          done

      - name: Run Playwright smoke tests
        working-directory: tests/playwright
        env:
          PW_BASE_URL: http://localhost:3000
        run: |
          npx playwright test

      - name: Stop http-server
        if: always()
        run: |
          if [ -f /tmp/http-server.pid ]; then
            kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true
          fi

      - name: Upload Playwright artifact (screenshots + trace + HTML report)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            tests/playwright/playwright-report/
            tests/playwright/test-results/
          retention-days: 14
          if-no-files-found: ignore
