name: New Content Reminder

on:
  schedule:
    # 15th of every month at 9:00 AM EST (14:00 UTC)
    - cron: '0 14 15 * *'
  workflow_dispatch:

jobs:
  content-reminder:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Count existing content
        id: counts
        run: |
          TIP_COUNT=$(ls tips/*.html 2>/dev/null | grep -v index.html | wc -l || echo "0")
          ANSWER_COUNT=$(ls answers/*.html 2>/dev/null | grep -v index.html | wc -l || echo "0")
          SCAM_COUNT=$(ls resources/scam-deep-dives/*.html 2>/dev/null | wc -l || echo "0")
          echo "tip_count=$TIP_COUNT" >> $GITHUB_OUTPUT
          echo "answer_count=$ANSWER_COUNT" >> $GITHUB_OUTPUT
          echo "scam_count=$SCAM_COUNT" >> $GITHUB_OUTPUT

      - name: Create content reminder issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('en-CA', { year: 'numeric', month: 'long', day: 'numeric' });
            const tipCount = '${{ steps.counts.outputs.tip_count }}';
            const answerCount = '${{ steps.counts.outputs.answer_count }}';
            const scamCount = '${{ steps.counts.outputs.scam_count }}';

            const tipIdeas = [
              "New scam variation spotted in Ontario — write a tips article warning seniors",
              "Seasonal safety tip: summer travel phone security checklist",
              "New iOS update released — write a 'what's new and why it matters for seniors' tip",
              "Government benefit change — update the provincial programs resource page",
              "Holiday scam season alert — gift card scam reminder tip",
              "Back-to-school season: help seniors understand AI tools their grandchildren are using",
              "Tax season reminder: CRA scam signs and how to use My CRA Account safely",
              "Winter tip: home Wi-Fi security when family visits over the holidays"
            ];

            const answerIdeas = [
              "How do I set up automatic app updates?",
              "What should I do if I forgot my Apple ID password?",
              "Is it safe to use my fingerprint to log in to banking apps?",
              "How do I know if my Wi-Fi router is secure?",
              "What is two-step verification and how is it different from two-factor authentication?",
              "How do I delete my data from a website?",
              "What is identity theft and how do I prevent it?",
              "How do I talk to my bank about a suspicious charge?"
            ];

            const weekNum = Math.floor(Date.now() / (7 * 24 * 60 * 60 * 1000));
            const tipIdea = tipIdeas[weekNum % tipIdeas.length];
            const answerIdea = answerIdeas[weekNum % answerIdeas.length];

            const body = `# Monthly Content Reminder — ${today}

## Current Content Inventory
| Type | Count |
|------|-------|
| Tips articles | ${tipCount} |
| Quick answer pages | ${answerCount} |
| Scam deep dives | ${scamCount} |

## Suggested New Content This Month

### Tips Article Idea
> ${tipIdea}

**To create:** Write a new article in /tips/ following the existing format with Article + FAQPage JSON-LD.

### Answer Page Idea
> ${answerIdea}

**To create:** Write a new page in /answers/ following the existing format with FAQPage + BreadcrumbList JSON-LD.

## Content Audit Checklist
- [ ] Check if any existing tips are seasonally outdated and need updating
- [ ] Review any new scam types reported by CAFC (antifraudcentre.ca) and create a deep dive
- [ ] Check Google Search Console for zero-impression answer pages that may need updating
- [ ] Verify all phone numbers and external links in the support directory are still active
- [ ] Check if any Ontario government program details have changed (ODB rates, benefit amounts)

## Quick Links
- [Tips directory](/tips/)
- [Answers directory](/answers/)
- [Scam deep dives](/resources/scam-deep-dives/)
- [Provincial Programs](/resources/provincial-programs.html)
- [Support Directory](/resources/support-directory.html)

---
*Generated by GitHub Actions — New Content Reminder workflow (15th of each month)*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📝 Content Reminder — ${today}`,
              body: body,
              labels: ['content', 'monthly-reminder']
            });
