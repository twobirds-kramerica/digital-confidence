name: Weekly Build Summary

on:
  schedule:
    - cron: '0 13 * * 1'   # Every Monday 8 AM EST (13:00 UTC)
  workflow_dispatch:

jobs:
  weekly-summary:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # Full history for commit log

      - name: Generate Weekly Build Summary issue
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const now = new Date();
            const weekStart = new Date(now - 7 * 24 * 60 * 60 * 1000);
            const weekLabel = weekStart.toISOString().split('T')[0] + ' to ' + now.toISOString().split('T')[0];

            // Get commits from last 7 days
            let commits = '';
            try {
              commits = execSync(
                `git log --oneline --after="${weekStart.toISOString()}" --before="${now.toISOString()}"`,
                { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' }
              ).trim();
            } catch (e) { commits = 'Could not retrieve commit log.'; }

            // Count files changed
            let filesChanged = 0;
            try {
              const stat = execSync(
                `git diff --name-only HEAD~7 HEAD 2>/dev/null || git diff --name-only $(git rev-list --max-parents=0 HEAD) HEAD`,
                { cwd: process.env.GITHUB_WORKSPACE, encoding: 'utf8' }
              ).trim();
              filesChanged = stat ? stat.split('\n').length : 0;
            } catch (e) { filesChanged = 'Unknown'; }

            // Count modules, tips, geo pages
            const fs = require('fs');
            const path = require('path');
            const workspace = process.env.GITHUB_WORKSPACE;
            const moduleCount = fs.readdirSync(workspace).filter(f => f.startsWith('module-') && f.endsWith('.html')).length;
            const tipCount = fs.existsSync(path.join(workspace, 'tips')) ? fs.readdirSync(path.join(workspace, 'tips')).filter(f => f.endsWith('.html') && f !== 'index.html').length : 0;
            const geoCount = fs.existsSync(path.join(workspace, 'geo-content')) ? fs.readdirSync(path.join(workspace, 'geo-content')).filter(f => f.endsWith('.html')).length : 0;

            const body = [
              `## Weekly Build Summary — Week of ${weekLabel}`,
              '',
              `**Generated:** ${now.toLocaleString('en-CA', { timeZone: 'America/Toronto', dateStyle: 'full' })}`,
              '',
              '### Site Health Snapshot',
              `| Metric | Count |`,
              `|--------|-------|`,
              `| Training modules | ${moduleCount} |`,
              `| Tips articles | ${tipCount} |`,
              `| GEO intent pages | ${geoCount} |`,
              `| Files changed (7 days) | ${filesChanged} |`,
              '',
              '### Commits This Week',
              commits ? '```\n' + commits + '\n```' : '_No commits this week._',
              '',
              '### Checklist',
              '- [ ] Review any content flagged by Monthly Freshness workflow',
              '- [ ] Check Formspree dashboard for feedback submissions (formspree.io/f/xeerqryj)',
              '- [ ] Review social dashboard (/_social/social-dashboard.html) and schedule posts',
              '- [ ] Check site analytics in Google Analytics or Clarity',
              '- [ ] Any module needing content update based on new Canadian scam reports?',
              '',
              '---',
              '*Auto-generated by GitHub Actions. Close when weekly review is complete.*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly Build Summary — ${weekLabel}`,
              body,
              labels: ['weekly-review', 'maintenance'],
              assignees: ['twobirds-kramerica']
            });

            console.log(`Weekly summary issue created for ${weekLabel}`);
