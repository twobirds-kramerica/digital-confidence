name: Monthly Business Report

on:
  schedule:
    # 1st of every month at 8:00 AM EST (13:00 UTC)
    - cron: '0 13 1 * *'
  workflow_dispatch:

jobs:
  monthly-business-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gather business metrics
        id: metrics
        run: |
          # Commit count last 30 days
          COMMITS=$(git log --oneline --since="30 days ago" | wc -l)

          # Files changed last 30 days
          FILES_CHANGED=$(git diff --name-only HEAD~$(git log --oneline --since="30 days ago" | wc -l) HEAD 2>/dev/null | wc -l || echo "N/A")

          # Module count (HTML files matching module-*.html)
          MODULE_COUNT=$(ls module-*.html module-*-*.html 2>/dev/null | grep -v 'module-2-5' | wc -l)

          # Grant file count
          GRANT_COUNT=$(ls _grants/applications/*.md 2>/dev/null | wc -l || echo "0")

          # B2B sequence count
          B2B_COUNT=$(ls _b2b/outreach-sequences/*.md 2>/dev/null | wc -l || echo "0")

          # Docs count
          DOCS_COUNT=$(ls _docs/*.md 2>/dev/null | wc -l || echo "0")

          echo "commits=$COMMITS" >> $GITHUB_OUTPUT
          echo "module_count=$MODULE_COUNT" >> $GITHUB_OUTPUT
          echo "grant_count=$GRANT_COUNT" >> $GITHUB_OUTPUT
          echo "b2b_count=$B2B_COUNT" >> $GITHUB_OUTPUT
          echo "docs_count=$DOCS_COUNT" >> $GITHUB_OUTPUT

      - name: Get recent commits summary
        id: recent
        run: |
          RECENT=$(git log --oneline --since="30 days ago" --format="- %s" | head -20)
          echo "recent_commits<<EOF" >> $GITHUB_OUTPUT
          echo "$RECENT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create monthly business report issue
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toLocaleDateString('en-CA', { year: 'numeric', month: 'long' });
            const metrics = {
              commits: '${{ steps.metrics.outputs.commits }}',
              modules: '${{ steps.metrics.outputs.module_count }}',
              grants: '${{ steps.metrics.outputs.grant_count }}',
              b2b: '${{ steps.metrics.outputs.b2b_count }}',
              docs: '${{ steps.metrics.outputs.docs_count }}'
            };
            const recentCommits = `${{ steps.recent.outputs.recent_commits }}`;

            const body = `# Monthly Business Report — ${date}

## Platform Metrics
| Metric | Value |
|--------|-------|
| Commits this month | ${metrics.commits} |
| Learning modules live | ${metrics.modules} |
| Grant applications | ${metrics.grants} |
| B2B outreach sequences | ${metrics.b2b} |
| Documentation files | ${metrics.docs} |

## Development Activity (Last 30 Days)
${recentCommits || 'No commits in the last 30 days.'}

## Monthly Review Checklist
- [ ] Export Formspree feedback CSV → save to /backups/feedback/
- [ ] Review zero-result searches in admin/search-analytics.html
- [ ] Check for broken links (see link-checker workflow)
- [ ] Review any open grant deadlines
- [ ] Update _b2b/pipeline/ with any new contacts or outcomes
- [ ] Check if any modules need content updates (see _docs/module-audit.md)

## Two Birds Innovation — Business Actions
- [ ] Send any pending B2B outreach emails
- [ ] Follow up on any warm leads (see _b2b/pipeline/)
- [ ] Update quality dashboard if needed
- [ ] Check Google Search Console for any new impressions or clicks

---
*Generated by GitHub Actions — Monthly Business Report workflow*`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📊 Monthly Business Report — ${date}`,
              body: body,
              labels: ['monthly-report', 'business']
            });
