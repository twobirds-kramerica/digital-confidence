name: Monthly Content Report

on:
  schedule:
    # First day of every month at 08:00 UTC
    - cron: '0 8 1 * *'
  workflow_dispatch:

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate monthly report
        id: report
        run: |
          # Count content files
          HTML_COUNT=$(find . -name "*.html" -not -path "./.git/*" -not -path "./node_modules/*" | wc -l | tr -d ' ')
          MODULE_COUNT=$(ls module-*.html 2>/dev/null | wc -l | tr -d ' ')
          ANSWER_COUNT=$(ls answers/*.html 2>/dev/null | wc -l | tr -d ' ')
          RESOURCE_COUNT=$(ls resources/*.html 2>/dev/null | wc -l | tr -d ' ')
          JS_COUNT=$(ls js/*.js 2>/dev/null | wc -l | tr -d ' ')
          CSS_COUNT=$(ls css/*.css 2>/dev/null | wc -l | tr -d ' ')

          # Sitemap URL count
          SITEMAP_COUNT=$(grep -c "<loc>" sitemap.xml 2>/dev/null || echo "0")

          # Git stats for past 30 days
          COMMITS_30=$(git log --since="30 days ago" --oneline | wc -l | tr -d ' ')
          FILES_CHANGED=$(git log --since="30 days ago" --name-only --pretty=format: | grep -v "^$" | sort -u | wc -l | tr -d ' ')
          LAST_COMMIT=$(git log -1 --format="%ai — %s" | head -c 100)

          MONTH=$(date '+%B %Y')

          REPORT="# Monthly Content Report — ${MONTH}\n\n"
          REPORT+="**Generated:** $(date -u '+%Y-%m-%d %H:%M UTC')\n\n"
          REPORT+="## Content Inventory\n\n"
          REPORT+="| Category | Count |\n|----------|-------|\n"
          REPORT+="| Total HTML pages | ${HTML_COUNT} |\n"
          REPORT+="| Training modules | ${MODULE_COUNT} |\n"
          REPORT+="| Quick Answer pages | ${ANSWER_COUNT} |\n"
          REPORT+="| Resource articles | ${RESOURCE_COUNT} |\n"
          REPORT+="| JavaScript files | ${JS_COUNT} |\n"
          REPORT+="| CSS files | ${CSS_COUNT} |\n"
          REPORT+="| Sitemap URLs | ${SITEMAP_COUNT} |\n\n"
          REPORT+="## Activity (Last 30 Days)\n\n"
          REPORT+="| Metric | Count |\n|--------|-------|\n"
          REPORT+="| Commits | ${COMMITS_30} |\n"
          REPORT+="| Files changed | ${FILES_CHANGED} |\n"
          REPORT+="| Most recent commit | ${LAST_COMMIT} |\n\n"
          REPORT+="## Action Items for This Month\n\n"
          REPORT+="- [ ] Export feedback CSV from Formspree dashboard (https://formspree.io/f/xeerqryj)\n"
          REPORT+="- [ ] Update admin/performance-data.json with real GA4 data\n"
          REPORT+="- [ ] Review any issues labelled 'content' or 'bug' from last month\n"
          REPORT+="- [ ] Check if any modules need freshness updates (look for 'last reviewed' dates over 6 months old)\n"
          REPORT+="- [ ] Verify scam-alerts page is current with recent Canadian fraud trends\n\n"
          REPORT+="_Auto-generated by GitHub Actions. Reply to this issue to add notes._"

          echo -e "$REPORT" > monthly-report.md
          echo "month=$MONTH" >> $GITHUB_OUTPUT

      - name: Create monthly report issue
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: '📊 Monthly Content Report — ${{ steps.report.outputs.month }}'
          content-filepath: ./monthly-report.md
          labels: |
            report
            monthly
            automated
