name: Accessibility (axe-core)

# Automates the existing ?qa=true axe-core overlay as a CI check.
# Runs on every push to main, every PR, and can be triggered manually.
# Fails the build on any critical WCAG violation. Serious / moderate / minor
# are reported in the job summary + uploaded artifact but do not block.
#
# Related: accessibility-reminder.yml still runs quarterly and creates the
# human-facing review issue. This workflow is the automated counterpart —
# catches regressions between reviews.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'css/**'
      - 'js/**'
      - '.github/workflows/axe-core.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  axe:
    name: axe-core scan (WCAG 2.0 + 2.1 A/AA)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install axe-core CLI and http-server
        run: |
          npm install -g @axe-core/cli@4.10.0 http-server@14.1.1

      - name: Serve DCC site on localhost:8080
        run: |
          http-server . -p 8080 -s &
          echo $! > /tmp/http-server.pid
          # Wait for server to be reachable
          for i in 1 2 3 4 5; do
            if curl -sSf http://localhost:8080/ > /dev/null; then
              echo "Server up."
              break
            fi
            sleep 1
          done

      - name: Run axe-core on representative pages
        id: axe
        run: |
          mkdir -p axe-reports
          set +e

          PAGES=(
            "index.html"
            "about.html"
            "support-directory.html"
            "modules/module-1.html"
            "final-quiz.html"
            "faq.html"
            "classic/index.html"
            "classic/module-1.html"
            "404.html"
          )

          for page in "${PAGES[@]}"; do
            echo "::group::axe scan — $page"
            slug=$(echo "$page" | sed 's|/|__|g')
            axe "http://localhost:8080/$page" \
              --tags wcag2a,wcag2aa,wcag21a,wcag21aa \
              --save "axe-reports/$slug.json" \
              --exit
            axe_status=$?
            echo "exit=$axe_status"
            echo "::endgroup::"
          done

          # Always succeed here; failure decision is made in the summary step
          # based on parsed violation counts. This keeps all pages scanned
          # even if an early page had violations.
          exit 0

      - name: Summarise violations
        id: summary
        run: |
          CRITICAL=0
          SERIOUS=0
          MODERATE=0
          MINOR=0

          declare -A CRITICAL_BY_PAGE
          declare -A SERIOUS_BY_PAGE

          for f in axe-reports/*.json; do
            [ -f "$f" ] || continue
            page=$(basename "$f" .json | sed 's|__|/|g')

            C=$(jq '[.[].violations[]? | select(.impact=="critical")] | length' "$f" 2>/dev/null || echo 0)
            S=$(jq '[.[].violations[]? | select(.impact=="serious")] | length' "$f" 2>/dev/null || echo 0)
            M=$(jq '[.[].violations[]? | select(.impact=="moderate")] | length' "$f" 2>/dev/null || echo 0)
            N=$(jq '[.[].violations[]? | select(.impact=="minor")] | length' "$f" 2>/dev/null || echo 0)

            # Fallback: some axe versions emit a top-level object, not an array
            if [ "$C" = "0" ] && [ "$S" = "0" ] && [ "$M" = "0" ] && [ "$N" = "0" ]; then
              C=$(jq '[.violations[]? | select(.impact=="critical")] | length' "$f" 2>/dev/null || echo 0)
              S=$(jq '[.violations[]? | select(.impact=="serious")] | length' "$f" 2>/dev/null || echo 0)
              M=$(jq '[.violations[]? | select(.impact=="moderate")] | length' "$f" 2>/dev/null || echo 0)
              N=$(jq '[.violations[]? | select(.impact=="minor")] | length' "$f" 2>/dev/null || echo 0)
            fi

            CRITICAL=$((CRITICAL + C))
            SERIOUS=$((SERIOUS + S))
            MODERATE=$((MODERATE + M))
            MINOR=$((MINOR + N))

            CRITICAL_BY_PAGE["$page"]=$C
            SERIOUS_BY_PAGE["$page"]=$S
          done

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "serious=$SERIOUS"   >> $GITHUB_OUTPUT
          echo "moderate=$MODERATE" >> $GITHUB_OUTPUT
          echo "minor=$MINOR"       >> $GITHUB_OUTPUT

          {
            echo "## axe-core accessibility report"
            echo ""
            echo "Tags: WCAG 2.0 + 2.1, levels A + AA"
            echo ""
            echo "| Impact | Count |"
            echo "|--------|-------|"
            echo "| 🔴 Critical | $CRITICAL |"
            echo "| 🟠 Serious  | $SERIOUS |"
            echo "| 🟡 Moderate | $MODERATE |"
            echo "| 🟢 Minor    | $MINOR |"
            echo ""
            echo "### Per-page (critical / serious)"
            echo ""
            echo "| Page | Critical | Serious |"
            echo "|------|----------|---------|"
            for page in "${!CRITICAL_BY_PAGE[@]}"; do
              echo "| \`$page\` | ${CRITICAL_BY_PAGE[$page]} | ${SERIOUS_BY_PAGE[$page]} |"
            done
            echo ""
            echo "Full JSON reports: see the \`axe-reports\` artifact attached to this run."
          } >> $GITHUB_STEP_SUMMARY

      - name: Upload axe reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-reports
          path: axe-reports/
          retention-days: 30

      - name: Stop http-server
        if: always()
        run: |
          if [ -f /tmp/http-server.pid ]; then
            kill "$(cat /tmp/http-server.pid)" 2>/dev/null || true
          fi

      - name: Fail on critical violations
        if: steps.summary.outputs.critical != '0'
        run: |
          echo "::error::axe-core found ${{ steps.summary.outputs.critical }} critical WCAG violation(s)."
          echo "Download the axe-reports artifact and inspect the JSON files."
          exit 1
