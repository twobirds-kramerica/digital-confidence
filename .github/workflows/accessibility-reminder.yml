name: Quarterly Accessibility Review Reminder

on:
  schedule:
    # Runs first day of January, April, July, October at 9 AM UTC
    - cron: '0 9 1 1,4,7,10 *'
  workflow_dispatch:

jobs:
  accessibility-reminder:
    name: Open accessibility review issue
    runs-on: ubuntu-latest
    steps:
      - name: Create quarterly accessibility review issue
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toLocaleDateString('en-CA', {
              year: 'numeric', month: 'long', day: 'numeric'
            });

            const body = [
              '## Quarterly Accessibility Review — ' + today,
              '',
              'This issue is created automatically every quarter to prompt a full accessibility review of the Digital Confidence Centre.',
              '',
              '### Checklist',
              '',
              '#### Device Testing',
              '- [ ] Test all module pages with VoiceOver on iPad (Settings → Accessibility → VoiceOver)',
              '- [ ] Verify all images have descriptive alt text',
              '- [ ] Confirm all form fields have associated labels',
              '- [ ] Test keyboard-only navigation from top to bottom of key pages',
              '',
              '#### Visual Checks',
              '- [ ] Check colour contrast ratios on all new components added since last review (minimum 4.5:1 for text)',
              '- [ ] Verify font size toggles (Small / Medium / Large / XL / XXL) work correctly on all pages',
              '- [ ] Test all pages at 200% browser zoom — no horizontal scrolling should occur',
              '- [ ] Confirm high contrast mode (if applicable) renders correctly',
              '',
              '#### Content & Language',
              '- [ ] Review any new pages added since last review for plain-language compliance',
              '- [ ] Confirm FR translations are present on all new UI elements',
              '- [ ] Verify all new Q&A accordions open and close correctly with keyboard',
              '',
              '#### Technical',
              '- [ ] Review voice feedback integration (voice search, read-aloud) on Safari/iOS',
              '- [ ] Confirm ARIA live regions announce dynamic content changes',
              '- [ ] Run axe DevTools scan on homepage, module-1.html, and final-quiz.html',
              '- [ ] Check that focus indicators are visible on all interactive elements',
              '',
              '### Pages to prioritise',
              '- index.html (homepage)',
              '- module-1.html through module-19-digital-legacy.html',
              '- final-quiz.html',
              '- print-centre.html',
              '- scam-simulator.html',
              '',
              '### Resources',
              '- [WCAG 2.1 Quick Reference](https://www.w3.org/WAI/WCAG21/quickref/)',
              '- [axe DevTools (free Chrome extension)](https://www.deque.com/axe/)',
              '- [WebAIM Contrast Checker](https://webaim.org/resources/contrastchecker/)',
              '',
              '---',
              '*Auto-generated by GitHub Actions — Quarterly Accessibility Review workflow*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Quarterly Accessibility Review — ' + today,
              body: body,
              labels: ['accessibility', 'quarterly-review']
            });
