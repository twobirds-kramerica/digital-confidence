name: HAL Prompt Queue Monitor

on:
  schedule:
    # Every 6 hours — 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch:

jobs:
  prompt-queue-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get recent build activity
        id: activity
        run: |
          COMMITS=$(git log --oneline --since="6 hours ago" --format="- %s" | head -5)
          TOTAL_TODAY=$(git log --oneline --since="24 hours ago" --format="%h" | wc -l | tr -d ' ')
          echo "recent_commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "total_today=$TOTAL_TODAY" >> $GITHUB_OUTPUT

      - name: Check for existing open prompt-queue issues
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: 'prompt-queue',
              state: 'open',
              per_page: 5
            });
            const openCount = issues.data.length;
            core.setOutput('open_count', openCount);
            return openCount;

      - name: Create prompt queue status issue
        uses: actions/github-script@v7
        with:
          script: |
            const now = new Date();
            const dateStr = now.toLocaleDateString('en-CA', {
              weekday: 'long', year: 'numeric', month: 'long', day: 'numeric',
              hour: '2-digit', minute: '2-digit', timeZone: 'America/Toronto'
            });

            const recentCommits = `${{ steps.activity.outputs.recent_commits }}`;
            const totalToday = '${{ steps.activity.outputs.total_today }}';
            const openQueueIssues = '${{ steps.check.outputs.open_count }}';

            const hasActivity = recentCommits.trim().length > 0;

            const body = [
              '# HAL Prompt Queue Monitor — ' + dateStr + ' EST',
              '',
              '> This is an automated 6-hour heartbeat from the HAL Stack prompt tracking system.',
              '> It exists because the automated n8n + SQLite system is not yet installed (ETA: April 2026).',
              '> Until then, use this issue to manually confirm your prompt queue state.',
              '',
              '## Build Activity (Last 6 Hours)',
              hasActivity
                ? recentCommits
                : '*No commits in the last 6 hours.*',
              '',
              '**Commits today:** ' + totalToday,
              '',
              '## Prompt Queue — Manual Check Required',
              '',
              '1. Open Gmail and search: `subject:⏳`',
              '2. Any results = prompts that were generated but not yet confirmed complete',
              '3. For each unconfirmed prompt:',
              '   - If it ran successfully → update subject to `✅ CONFIRMED — [topic]`',
              '   - If it failed → update subject to `❌ FAILED — [topic]`',
              '   - If still running → leave as `⏳ UNCONFIRMED PROMPT — [topic]`',
              '',
              '## Open Prompt-Queue Issues',
              parseInt(openQueueIssues) > 0
                ? `**${openQueueIssues} open prompt-queue issue(s)** — review and close any that are complete.`
                : '*No open prompt-queue issues. Queue is clear.*',
              '',
              '## HAL Stack Status',
              '| Component | Status |',
              '|-----------|--------|',
              '| Claude Code | ✅ Operational |',
              '| GitHub Actions | ✅ Running |',
              '| n8n | ⏳ Not yet installed |',
              '| SQLite Prompt DB | ⏳ Not yet set up |',
              '| Cloudflare Tunnel | ⏳ Not yet configured |',
              '',
              '---',
              '*Close this issue once you have reviewed your prompt queue.*',
              '*Generated by HAL Prompt Queue Monitor — `prompt-queue-monitor.yml`*'
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `⏳ HAL Prompt Queue Check — ${dateStr} EST`,
              body: body,
              labels: ['prompt-queue', 'hal-stack']
            });
